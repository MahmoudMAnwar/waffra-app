name: waffra
description: Waffra - Saudi expense tracker
publish_to: none
version: 3.0.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/waffra_app_icon.png"
  adaptive_icon_background: "#004B3B"
  adaptive_icon_foreground: "assets/waffra_app_icon.png"
  min_sdk_android: 21
