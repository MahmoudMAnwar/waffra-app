name: waffra
description: Waffra - Saudi expense tracker
publish_to: none
version: 3.4.0+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  local_auth: ^2.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  fl_chart: ^0.69.2
  image: 4.5.4
  archive: 4.0.9
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  pdf: ^3.11.1
  printing: ^5.13.4
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.0.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/waffra_app_icon.png"
  adaptive_icon_background: "#064D3B"
  adaptive_icon_foreground: "assets/waffra_app_icon.png"
  min_sdk_android: 21
