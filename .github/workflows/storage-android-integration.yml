name: Waffra Android encrypted DB integration

on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'lib/storage/**'
      - 'pubspec.yaml'
      - '.github/workflows/storage-android-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waffra-pr-storage-android-integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-encrypted-db-shard:
    name: encrypted-db-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [vault, cloud, receipts, release]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prefetch SHA256-verified official SQLite3MC native release assets
        uses: ./.github/actions/prefetch-sqlite3mc
        with:
          github-token: ${{ github.token }}
      - name: Prefetch SHA256-verified Gradle wrapper distribution
        uses: ./.github/actions/prefetch-gradle
        with:
          github-token: ${{ github.token }}
      - name: Generate Android project without clobbering user files
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Java 8 core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - name: Resolve packages and native assets
        run: |
          flutter pub get
      - name: Analyze integration test
        run: dart analyze integration_test/storage_encryption_android_test.dart integration_test/offline_restore_android_test.dart integration_test/copied_receipt_ledger_android_test.dart integration_test/fresh_vault_first_run_android_test.dart integration_test/offline_finance_e2e_android_test.dart integration_test/finance_release_regressions_android_test.dart integration_test/live_finance_migration_receipts_android_test.dart integration_test/verified_encrypted_finance_bridge_android_test.dart integration_test/portable_encrypted_receipts_android_test.dart integration_test/finance_cloud_final_release_android_test.dart integration_test/m78_parallel_combined_android_test.dart
      - name: Enable Linux KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reclaim hosted-runner disk for mandatory Android SQLCipher checks
        shell: bash
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h .
      # Android first-test compilation (Gradle/CMake/plugins) previously consumed
      # the full 240s flutter-test budget before a single assertion ran.
      # Prebuild the same first test target, fail closed on any build failure,
      # then keep each existing per-file emulator timeout unchanged.
      - name: Precompile first shard integration APK outside device test timeout
        shell: bash
        timeout-minutes: 18
        run: bash .github/scripts/prebuild-android-finance-integration.sh "${{ matrix.shard }}"
      # Emulator start-up can intermittently refuse adb TCP 5554 on hosted
      # runners; a successful static analyzer is not a substitute for the
      # Android runtime test. Retry once with a fresh, independent API 35 emulator.
      - name: Test encrypted vault on Android emulator (primary)
        id: emulator_primary
        continue-on-error: true
        env:
          ANDROID_FINANCE_SHARD: ${{ matrix.shard }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash .github/scripts/run-android-finance-integration.sh
      - name: Reset adb before a clean emulator retry
        if: steps.emulator_primary.outcome == 'failure'
        shell: bash
        run: |
          adb kill-server || true
          adb start-server
      - name: Retry complete finance tests on fresh API 35 after emulator failure
        if: steps.emulator_primary.outcome == 'failure'
        env:
          ANDROID_FINANCE_SHARD: ${{ matrix.shard }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash .github/scripts/run-android-finance-integration.sh

  android-encrypted-db:
    name: android-encrypted-db
    if: always()
    needs: android-encrypted-db-shard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require all mandatory SQLCipher emulator shards
        env:
          SHARDS_RESULT: ${{ needs.android-encrypted-db-shard.result }}
        shell: bash
        run: |
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "::error title=Mandatory Android finance shard failed::Encrypted finance runtime shards failed, were canceled, or timed out"
            exit 1
          fi
          echo "All four encrypted Android finance integration shards passed."
