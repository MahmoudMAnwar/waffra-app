name: Waffra Android encrypted DB integration

on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'lib/storage/**'
      - 'pubspec.yaml'
      - '.github/workflows/storage-android-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-encrypted-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project without clobbering user files
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Java 8 core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - name: Resolve packages and native assets
        run: flutter pub get
      - name: Analyze integration test
        run: dart analyze integration_test/storage_encryption_android_test.dart integration_test/offline_restore_android_test.dart integration_test/copied_receipt_ledger_android_test.dart integration_test/fresh_vault_first_run_android_test.dart integration_test/offline_finance_e2e_android_test.dart integration_test/finance_release_regressions_android_test.dart integration_test/live_finance_migration_receipts_android_test.dart integration_test/verified_encrypted_finance_bridge_android_test.dart integration_test/portable_encrypted_receipts_android_test.dart
      - name: Enable Linux KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test encrypted vault on real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            # Android's test VM service sometimes stops responding when many
            # independent flutter test sessions reuse a single emulator.
            # Give every invocation its own bounded budget and report which
            # test hung instead of letting GitHub cancel the entire 45m job.
            run_android_test() {
              filename="$1"
              seconds="$2"
              echo "::group::Android integration: ${filename}"
              echo "ANDROID_TEST_START:${filename}"
              if timeout --signal=TERM --kill-after=20s "${seconds}s" \
                flutter test "integration_test/${filename}" -d emulator-5554 --reporter expanded; then
                echo "ANDROID_TEST_PASS:${filename}"
              else
                code="$?"
                echo "::error title=Android emulator failure::${filename} stopped or exceeded ${seconds}s (exit=${code})"
                timeout 20s adb -s emulator-5554 logcat -d -t 120 '*:E' || true
                exit "${code}"
              fi
              echo "::endgroup::"
            }
            # Warm up Gradle once; then run the previously hung bridge test and
            # NEW attachment parity test BEFORE unrelated older test sessions.
            run_android_test storage_encryption_android_test.dart 720
            run_android_test verified_encrypted_finance_bridge_android_test.dart 240
            run_android_test portable_encrypted_receipts_android_test.dart 240
            run_android_test offline_restore_android_test.dart 240
            run_android_test copied_receipt_ledger_android_test.dart 240
            run_android_test fresh_vault_first_run_android_test.dart 240
            run_android_test offline_finance_e2e_android_test.dart 240
            run_android_test finance_release_regressions_android_test.dart 240
            run_android_test live_finance_migration_receipts_android_test.dart 240
