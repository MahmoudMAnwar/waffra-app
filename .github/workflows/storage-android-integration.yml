name: Waffra Android encrypted DB integration

on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'lib/storage/**'
      - 'pubspec.yaml'
      - '.github/workflows/storage-android-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-encrypted-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project without clobbering user files
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Resolve packages and native assets
        run: flutter pub get
      - name: Analyze integration test
        run: dart analyze integration_test/storage_encryption_android_test.dart
      - name: Enable Linux KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test encrypted vault on real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: flutter test integration_test/storage_encryption_android_test.dart -d emulator-5554 --reporter expanded
