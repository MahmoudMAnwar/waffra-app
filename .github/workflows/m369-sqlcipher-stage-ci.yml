name: M369 SQLCipher Backup Loss Prevention and Encrypted Domain Archive

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m369-sqlcipher-stage-ci.yml'
      - 'lib/storage/waffra_finance_domain_supplement.dart'
      - 'lib/storage/waffra_portable_encrypted_backup_exporter.dart'
      - 'test/storage/m365_domain_supplement_roundtrip_test.dart'
      - 'test/storage/portable_encrypted_backup_exporter_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-sqlcipher-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed finance files
        run: dart analyze lib/storage/waffra_finance_domain_supplement.dart lib/storage/waffra_portable_encrypted_backup_exporter.dart test/storage/m365_domain_supplement_roundtrip_test.dart test/storage/portable_encrypted_backup_exporter_test.dart
      - name: Check stage-specific regression
        run: flutter test --reporter expanded test/storage/m365_domain_supplement_roundtrip_test.dart test/storage/portable_encrypted_backup_exporter_test.dart
      - name: Confirm production cutover still requires independent evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('lib/storage/waffra_production_cutover_release_gate.dart').read_text()
          assert 'bool get automaticallyActivateSqlCipher => false;' in code
          print('No automatic SQLCipher production activation.')
          PY
