name: M251 Bank SMS Source-Ready Retry Gate (NO APK)

on:
  pull_request:
    branches:
      - feature/m250-sms-uncertain-commit-authority-recovery-20261026
    paths:
      - 'lib/main.dart'
      - 'lib/storage/waffra_sms_source_write_readiness.dart'
      - 'test/storage/m251_sms_source_readiness_test.dart'
      - '.github/workflows/m251-sms-source-readiness-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms-readiness-and-uncertain-recovery:
    name: Source readiness, recovery, no duplicate blind retry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/storage/m251_sms_source_readiness_test.dart test/storage/m250_bulk_sms_uncertain_commit_ui_test.dart test/storage/m175_live_finance_mutation_intent_test.dart --reporter expanded

  whole-app-tests:
    name: Full Flutter regression on the same candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded
