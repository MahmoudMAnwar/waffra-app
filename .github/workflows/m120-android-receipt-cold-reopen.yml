name: Waffra M120 Android Receipt Cold Reopen
on:
  pull_request:
    paths:
      - 'integration_test/m120_verified_receipt_reopen_android_test.dart'
      - 'lib/storage/waffra_encrypted_receipt_recycle.dart'
      - 'lib/storage/waffra_verified_encrypted_finance_bridge.dart'
      - '.github/workflows/m120-android-receipt-cold-reopen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-m120-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare disposable Android project
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - run: flutter pub get
      - name: Analyze Android SQLCipher receipt reopen test
        run: dart analyze integration_test/m120_verified_receipt_reopen_android_test.dart
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run disposable Android receipt restart and recovery proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash -c 'timeout --signal=TERM --kill-after=20s 900s flutter test integration_test/m120_verified_receipt_reopen_android_test.dart -d emulator-5554 --reporter expanded'
