name: Waffra M120 Android Receipt Cold Reopen
on:
  pull_request:
    paths:
      - 'integration_test/m120_verified_receipt_reopen_android_test.dart'
      - 'lib/storage/waffra_encrypted_receipt_recycle.dart'
      - 'lib/storage/waffra_verified_encrypted_finance_bridge.dart'
      - '.github/workflows/m120-android-receipt-cold-reopen.yml'
      - '.github/scripts/run-m120-android-receipt-reopen.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-m120-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact PR head for native-asset test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the expected tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare disposable Android project
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - run: flutter pub get
      - name: Analyze Android SQLCipher receipt reopen test
        run: dart analyze integration_test/m120_verified_receipt_reopen_android_test.dart
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run disposable Android receipt restart and recovery proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          # Only failed sqlite3mc GitHub native-asset downloads are retried.
          # A failing assertion, encryption error or Android test remains fatal.
          script: bash .github/scripts/run-m120-android-receipt-reopen.sh
