name: M202 Android SQLCipher Home-Widget Real Binder Dry Run (NO-GO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'integration_test/m202_existing_source_home_widget_android_test.dart'
      - '.github/workflows/m202-android-binder-dryrun.yml'
      - 'scripts/qa/m202_android_binder_scope_review.py'
      - 'docs/qa/m202-android-binder-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m202-real-binder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-real-sqlcipher-binder:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure source revision is exact and still fails closed
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          python3 scripts/qa/m202_android_binder_scope_review.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare disposable Android platform project
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          lib='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if lib not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+lib+'\n}\n'
          path.write_text(gradle)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze real binder Android test
        run: dart analyze integration_test/m202_existing_source_home_widget_android_test.dart
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute actual Android SQLCipher Home/Widget startup, write, cold reopen and bad-key rejection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash -c 'timeout --signal=TERM --kill-after=20s 900s flutter test integration_test/m202_existing_source_home_widget_android_test.dart -d emulator-5554 --reporter expanded'
      - name: Export non-authorizing test result
        if: success()
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/m202
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          result = {
            "exact_source_sha": os.environ["REVIEW_HEAD_SHA"],
            "emulator_sqlcipher_binder": "PASSED",
            "widget_confirmed_save_home_cold_reopen": "PASSED",
            "bad_key_rejected": True,
            "legacy_finance_untouched": True,
            "physical_device_witness_count": 0,
            "real_24_route_attestation_count": 0,
            "real_os_key_recovery_attested": False,
            "production_source_transition": False,
            "status": "DISPOSABLE_ANDROID_EMULATOR_ONLY_RELEASE_NO_GO"
          }
          Path("build/m202/acceptance.json").write_text(json.dumps(result, indent=2)+"\n")
          PY
      - name: Upload emulator-only finance binder evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m202-emulator-binder-evidence-not-production
          path: build/m202/acceptance.json
          if-no-files-found: error
