name: M174 Main ARM64 Compilation (CI Only)

# M653: CI-only unsigned ARM64 build duplicates the required freshly signed
# main APK. Retain this independent compile as manual diagnostic only.
# Every main push still compiles and validates its signed APK in android.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-arm64-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 21 for Android Lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # M654: Android Lint's JavaDocParser may invoke JDK21 List.removeLast.
      # Fail before native build on a wrong JDK; NEVER disable Gradle lint.
      - name: Require JDK 21 before Android compilation
        shell: bash
        run: |
          java -version
          java -version 2>&1 | grep -Eq 'version "21[.]'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prefetch SHA256-verified official SQLite3MC native release assets
        uses: ./.github/actions/prefetch-sqlite3mc
        with:
          github-token: ${{ github.token }}
      - name: Prefetch SHA256-verified Gradle wrapper distribution
        uses: ./.github/actions/prefetch-gradle
        with:
          github-token: ${{ github.token }}
      - run: |
          flutter pub get
      - name: Provision Android project for CI (not signed release)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Compile Android ARM64 release-mode APK on main SHA
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Archive CI-only APK, not real-device or store proof
        uses: actions/upload-artifact@v4
        with:
          name: m174-main-arm64-ci-apk-not-production-certified
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
