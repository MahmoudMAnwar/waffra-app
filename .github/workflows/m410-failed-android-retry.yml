name: M410 Bounded Failed Android UI Job Retry

on:
  # workflow_run executes trusted default-branch code, never an unreviewed PR script.
  workflow_run:
    workflows:
      - M274 Production UI Journeys and Golden Screenshot Review
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry-only-proven-infrastructure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Analyze exact-SHA failed job and retry ONLY if infrastructure signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qa/m410_failed_job_retry.py
