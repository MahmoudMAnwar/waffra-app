name: M410 Bounded Failed Android UI Job Retry

on:
  # Owner-authorized recovery only; completed M274 runs no longer create
  # hundreds of automatically Skipped M410 workflow runs.
  workflow_dispatch:
    inputs:
      failed_m274_run_id:
        description: 'Existing failed M274 pull-request workflow run ID (first attempt)'
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  retry-only-proven-infrastructure:
    # Runs trusted default-branch code only; no PR checkout or write token in PR events.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect explicit M274 run ID; retry only one proven infrastructure failure
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_M274_RUN_ID: ${{ inputs.failed_m274_run_id }}
        run: python3 scripts/qa/m410_failed_job_retry.py
