name: M169 Bilingual Privacy and Play Data Safety QA
on:
  pull_request:
    branches:
      - integration/m160-reconcile-main-m158-release-gate-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest scripts/qa/test_m169_policy_consistency.py -v
      - name: Review actual AR/EN drafts against installed SDK
        run: python3 scripts/qa/m169_policy_consistency.py
      - name: Retain existing launch blockers
        run: python3 -m unittest discover -s scripts -p 'test_m106_play_release_preflight.py' -v
