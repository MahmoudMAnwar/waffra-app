name: M249 Finance UI Rejected Write Recovery (NO APK)

on:
  pull_request:
    branches:
      - feature/m248-sqlcipher-manual-confirmation-20261026
    paths:
      - 'lib/main.dart'
      - 'lib/storage/waffra_verified_finance_authority.dart'
      - 'test/storage/m175_live_finance_mutation_intent_test.dart'
      - 'test/storage/m249_ui_finance_failure_refusal_test.dart'
      - '.github/workflows/m249-finance-ui-refusal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-rejection-and-source-intent:
    name: Rejected financial write cannot leave optimistic transaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/storage/m249_ui_finance_failure_refusal_test.dart test/storage/m175_live_finance_mutation_intent_test.dart --reporter expanded

  full-regression:
    name: Same-SHA full Flutter regression before review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded
