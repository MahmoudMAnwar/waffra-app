name: M250 Bulk SMS Uncertain Commit Recovery (NO APK)

on:
  pull_request:
    branches:
      - feature/m249-finance-ui-rollback-on-failed-commit-20261026
    paths:
      - 'lib/main.dart'
      - 'test/storage/m250_bulk_sms_uncertain_commit_ui_test.dart'
      - '.github/workflows/m250-sms-uncertain-commit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms-uncertain-commit-recovery:
    name: SMS source recovery guard plus live finance intent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/storage/m250_bulk_sms_uncertain_commit_ui_test.dart test/storage/m175_live_finance_mutation_intent_test.dart --reporter expanded

  entire-flutter-regression:
    name: Same-SHA entire Flutter regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded
