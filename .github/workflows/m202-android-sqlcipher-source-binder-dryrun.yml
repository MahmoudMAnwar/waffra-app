name: M202 Android SQLCipher Source Binding Dry Run (CI ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'integration_test/m202_home_widget_source_binder_android_test.dart'
      - 'lib/storage/waffra_unified_finance_writer.dart'
      - 'test/storage/unified_finance_writer_test.dart'
      - '.github/scripts/run-m202-sqlcipher-binder-android.sh'
      - '.github/workflows/m202-android-sqlcipher-source-binder-dryrun.yml'
      - '.github/workflows/m147-final-main-review-gate.yml'
      - 'scripts/qa/m202_source_binder_scope_review.py'
      - 'docs/qa/m202-sqlcipher-android-binder-dryrun.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m202-sqlcipher-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-source-binder-and-migration:
    name: Real emulator SQLCipher Home/Widget source binder + receipt preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Exact reviewed PR head, no synthetic merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin every source proof to HEAD and keep activation disabled
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          grep -F 'bool get automaticallyActivateSqlCipher => false;' lib/storage/waffra_production_cutover_release_gate.dart
          grep -F "sourceGuard.inspect()" lib/storage/waffra_production_finance_authority_binding.dart
          grep -F 'reasonCode: ' lib/storage/waffra_production_finance_source_guard.dart >/dev/null
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare isolated Android emulator project (no release secrets)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Android core library desugaring in disposable CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'compileOptions {' not in s:
              raise SystemExit('Android Kotlin compileOptions missing')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          decl = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if decl not in s:
              s += '\ndependencies {\n    ' + decl + '\n}\n'
          p.write_text(s)
          PY
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze real Android binding and existing migration/receipt cases
        run: |
          dart analyze \
            integration_test/m202_home_widget_source_binder_android_test.dart \
            integration_test/live_finance_migration_receipts_android_test.dart \
            integration_test/m120_verified_receipt_reopen_android_test.dart \
            integration_test/portable_encrypted_receipts_android_test.dart
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real on-device SQLCipher, key rejection and cold read
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash .github/scripts/run-m202-sqlcipher-binder-android.sh
      - name: Export explicit no-activation test evidence
        if: success()
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/m202
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("build/m202/source-test-evidence.json").write_text(
              json.dumps({
                "reviewed_sha": os.environ["REVIEW_HEAD_SHA"],
                "android_runtime_sqlcipher_binder": "PASSED_SYNTHETIC_VAULT",
                "widget_route_to_home_cold_read": "PASSED_SYNTHETIC_SOURCE",
                "original_bank_sms_notes_roundtrip": "PASSED_DISPOSABLE_SQLCIPHER_ANDROID_ONLY",
                "original_bank_sms_notes_in_legacy": False,
                "incorrect_key_prevents_finance_read": True,
                "migration_and_receipt_parity": "PASSED_SYNTHETIC_FIXTURES",
                "production_real_widget_engine_attested": False,
                "live_production_routes_attested": 0,
                "physical_phones_attested": 0,
                "account_deletion_and_privacy_release_approved": False,
                "sqlcipher_production_activated": False,
                "status": "ANDROID_EMULATOR_QA_ONLY_NO_GO"
              }, indent=2) + "\n")
          PY
      - name: Upload evidence without user data, images or secrets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m202-android-sqlcipher-binder-emulator-only
          path: build/m202/source-test-evidence.json
          if-no-files-found: error
