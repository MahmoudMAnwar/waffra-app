name: Waffra M99 Manifest-Last Cloud Sync Integrity

on:
  pull_request:
    paths:
      - 'lib/storage/waffra_cloud_manifest_last_outbox_drain.dart'
      - 'test/storage/m99_manifest_last_upload_test.dart'
      - '.github/workflows/m99-manifest-last-cloud-sync.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  m412-impact:
    name: M412 Only Run Tests Impacted By Latest PR Update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Compare exact before/after change set (missing evidence means RUN)
        id: impact
        run: python3 scripts/qa/m412_pr_changed_impact.py --workflow .github/workflows/m99-manifest-last-cloud-sync.yml

  encrypted-cloud-publication:
    needs: m412-impact
    if: ${{ needs.m412-impact.outputs.run == 'true' }}
    name: M99 E2EE queue order, conflict and recovery index safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Strictly analyze the runtime writer and safety tests
        run: >-
          dart analyze
          lib/storage/waffra_cloud_manifest_last_outbox_drain.dart
          test/storage/m99_manifest_last_upload_test.dart
      - name: Verify recovered phone sees index only after committed transactions
        run: flutter test test/storage/m99_manifest_last_upload_test.dart --reporter expanded
