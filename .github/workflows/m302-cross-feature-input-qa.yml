name: M302 Cross-Feature Precision and Validation QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m302-cross-feature-input-qa.yml'
      - 'lib/waffra_amount_formatter.dart'
      - 'lib/waffra_validators.dart'
      - 'lib/waffra_search.dart'
      - 'lib/main.dart'
      - 'lib/waffra_recurring_policy.dart'
      - 'test/m302_recurring_first_due_regression_test.dart'
      - 'test/m302_duplicate_receipt_cleanup_test.dart'
      - 'test/m302_category_rename_integrity_test.dart'
      - 'lib/currency_converter.dart'
      - 'lib/waffra_gold_calculator.dart'
      - 'lib/waffra_oil_market_section.dart'
      - 'test/m302_cross_feature_input_precision_test.dart'
      - 'docs/qa/m302-cross-feature-gap-register.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m302-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finance-input-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze modified app features and tests
        run: |
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos \
            lib/waffra_amount_formatter.dart \
            lib/waffra_validators.dart \
            lib/waffra_search.dart \
            lib/main.dart \
            lib/waffra_recurring_policy.dart \
            test/m302_recurring_first_due_regression_test.dart \
            test/m302_category_rename_integrity_test.dart \
            test/m302_duplicate_receipt_cleanup_test.dart \
            lib/currency_converter.dart \
            lib/waffra_gold_calculator.dart \
            lib/waffra_oil_market_section.dart \
            test/m302_cross_feature_input_precision_test.dart
      - name: New and existing input, amount and category regression tests
        run: |
          flutter test --reporter expanded \
            test/m302_cross_feature_input_precision_test.dart \
            test/m302_category_rename_integrity_test.dart \
            test/m302_recurring_first_due_regression_test.dart \
            test/m302_duplicate_receipt_cleanup_test.dart \
            test/m86_recurring_schedule_boundary_test.dart \
            test/waffra_amount_formatter_test.dart \
            test/waffra_validators_test.dart \
            test/m93_mandatory_validation_and_mobile_test.dart \
            test/m222_gold_calculator_test.dart \
            test/m259_oil_quotes_test.dart
      - name: Record unresolved production and device blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          audit=Path('docs/qa/m302-cross-feature-gap-register.md').read_text()
          for gate in ('SQLCipher production cutover', 'Physical Android/iOS',
                       'Multi-currency transaction persistence', 'Google Sign-In',
                       'All-PR combined SHA'):
              if gate not in audit:
                  raise SystemExit('M302 untracked release blocker: ' + gate)
          print('No unverified production or device sign-off claimed.')
          PY
