name: M253 M248-M252 Same-SHA SQLCipher Certification Rehearsal (NO APK)

on:
  pull_request:
    branches:
      - feature/m247-production-route-readiness-20261026
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - '.github/scripts/run-android-finance-integration.sh'
      - 'docs/qa/m253-five-pr-cumulative-certification.md'
      - '.github/workflows/m253-five-pr-cumulative-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-five-pr-finance-regression:
    name: M248-M252 consent, ambiguous SMS, fail-closed and SQL rollback
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m175_live_finance_mutation_intent_test.dart
          test/storage/m181_encrypted_catalog_atomic_install_test.dart
          test/storage/m249_ui_finance_failure_refusal_test.dart
          test/storage/m250_bulk_sms_uncertain_commit_ui_test.dart
          test/storage/m251_sms_source_readiness_test.dart
          test/storage/m252_single_sms_ui_recovery_test.dart
          --reporter expanded

  structural-24-route-release-refusal:
    name: 24-route dispatch, real source boundaries and production NO-GO
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m236_remaining_20_route_matrix_test.dart
          test/storage/m241_actual_route_matrix_dispatch_test.dart
          test/storage/m247_production_route_readiness_test.dart
          test/storage/m253_cumulative_production_release_refusal_test.dart
          test/storage/m187_active_restore_preflight_test.dart
          test/storage/m235_verified_encrypted_backup_export_route_test.dart
          --reporter expanded

  full-flutter-same-sha:
    name: Complete Flutter regression on the exact consolidated SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded

  physical-probe-contract-only:
    name: Validate physical evidence collector contract (NOT device attestation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 scripts/qa/m189_physical_device_source_probe.py --check-contract
      - run: python3 -m unittest discover -s test/qa -p 'm189_physical_device_source_probe_test.py'

  android-emulator-encrypted-source:
    name: Android emulator SQLCipher runtime, receipts and cold reopen (NOT signed physical devices)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Configure Java desugaring exactly as other Android QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Android Kotlin compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - run: flutter pub get
      - name: Analyze Android integration test suite
        run: >
          dart analyze
          integration_test/storage_encryption_android_test.dart
          integration_test/offline_restore_android_test.dart
          integration_test/copied_receipt_ledger_android_test.dart
          integration_test/fresh_vault_first_run_android_test.dart
          integration_test/offline_finance_e2e_android_test.dart
          integration_test/finance_release_regressions_android_test.dart
          integration_test/live_finance_migration_receipts_android_test.dart
          integration_test/verified_encrypted_finance_bridge_android_test.dart
          integration_test/portable_encrypted_receipts_android_test.dart
          integration_test/finance_cloud_final_release_android_test.dart
          integration_test/m78_parallel_combined_android_test.dart
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual disposable Android emulator integrations (API 35)
        id: emulator_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/run-android-finance-integration.sh
      - name: Reset adb before independent fallback boot
        if: steps.emulator_primary.outcome == 'failure'
        run: |
          adb kill-server || true
          adb start-server
      - name: Retry complete Android QA (API 34), never skip a test
        if: steps.emulator_primary.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash .github/scripts/run-android-finance-integration.sh

# No artifact upload, Android release APK, migration, live source switch,
# green-attestation automation or user-data export steps are permitted here.
