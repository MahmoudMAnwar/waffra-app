name: Waffra Firestore security rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'test/firebase/**'
      - 'lib/storage/waffra_cloud_*.dart'
      - 'lib/storage/waffra_firestore_encrypted_sync_transport.dart'
      - 'test/storage/cloud_*.dart'
      - 'integration_test/finance_cloud_final_release_android_test.dart'
      - '.github/workflows/firestore-security-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m412-impact:
    name: M412 Only Run Tests Impacted By Latest PR Update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Compare exact before/after change set (missing evidence means RUN)
        id: impact
        run: python3 scripts/qa/m412_pr_changed_impact.py --workflow .github/workflows/firestore-security-rules.yml

  firestore-emulator:
    needs: m412-impact
    if: ${{ needs.m412-impact.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          # M411: Firebase SDK 13.x / rules-unit-testing 6 require Node >=24.12.
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: test/firebase/package.json
      - name: Install isolated Firestore test dependencies
        run: npm --prefix test/firebase install --no-audit --no-fund
      - name: Test locked-down rules on local emulator only
        run: |
          ./test/firebase/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-waffra-rules-ci \
            'npm --prefix test/firebase test'
