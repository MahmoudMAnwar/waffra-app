name: M276 Finance Performance Baseline and Android Profile

on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/performance/**'
      - 'integration_test/m276_profile_finance_ui_android_test.dart'
      - 'test_driver/m276_perf_driver.dart'
      - 'scripts/qa/m276_verify_performance_evidence.py'
      - '.github/workflows/m276-finance-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m276-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore dependencies
        run: flutter pub get
      - name: Analyze all benchmark and driver sources
        run: dart analyze tool/performance/m276_finance_microbench_test.dart integration_test/m276_profile_finance_ui_android_test.dart test_driver/m276_perf_driver.dart
      - name: Collect 21 samples per synthetic performance scenario
        run: flutter test --reporter expanded tool/performance/m276_finance_microbench_test.dart
      - name: Validate input counts, p50/p95 and exact commit receipt
        run: python3 scripts/qa/m276_verify_performance_evidence.py
      - name: Upload performance evidence (informational timings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m276-host-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/performance/m276_finance_microbench.json
          if-no-files-found: warn

  android-profile-frames:
    # Profiling emulators is explicitly opt-in. GitHub hosts fluctuate and
    # this is not proof of physical-device production performance.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create disposable Android test runner
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Enable Android notification dependency core-library desugaring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          assert p.exists(), 'Flutter Android Kotlin Gradle project expected'
          src=p.read_text()
          assert 'compileOptions {' in src
          if 'isCoreLibraryDesugaringEnabled = true' not in src:
              src=src.replace('compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in src:
              src += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(src)
          PY
      - name: Profile real Flutter engine frame timings in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: flutter drive --profile --driver=test_driver/m276_perf_driver.dart --target=integration_test/m276_profile_finance_ui_android_test.dart -d emulator-5554
      - name: Upload engine FrameTiming P50/P95 and frame build/raster samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m276-android-profile-${{ github.sha }}
          path: build/performance/m276_android_profile_frames.json
          if-no-files-found: warn
