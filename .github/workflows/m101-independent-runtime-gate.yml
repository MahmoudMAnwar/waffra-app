name: Waffra M101 Cloud Recovery CAS

on:
  pull_request:
    paths:
      - 'lib/storage/waffra_cloud_recovery_revision_gate.dart'
      - 'test/storage/m101_cloud_recovery_revision_gate_test.dart'
      - '.github/workflows/m101-independent-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-finance-security:
    name: M101 read-only synthetic safety validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze changed production source plus acceptance suite
        run: dart analyze lib/storage/waffra_cloud_recovery_revision_gate.dart test/storage/m101_cloud_recovery_revision_gate_test.dart
      - name: Run safety acceptance on exact PR commit
        run: flutter test test/storage/m101_cloud_recovery_revision_gate_test.dart --reporter expanded
