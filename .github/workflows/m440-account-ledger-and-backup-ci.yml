name: Waffra M440 Accounts V3 Finance Regression
on:
  pull_request:
    paths:
      - 'lib/storage/waffra_accounts_**'
      - 'lib/storage/waffra_portable_encrypted_backup_exporter.dart'
      - 'lib/storage/waffra_unified_finance_writer.dart'
      - 'lib/storage/waffra_verified_accounts_api.dart'
      - 'lib/storage/waffra_verified_encrypted_finance_bridge.dart'
      - 'lib/waffra_account_transaction_form.dart'
      - 'lib/waffra_accounts_manager_page.dart'
      - 'test/storage/m440_**'
      - 'test/storage/m447_account_recurring_atomic_test.dart'
      - 'test/m440_**'
      - '.github/workflows/m440-account-ledger-and-backup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  m440-account-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Static analysis for all changed accounting surfaces
        run: |
          dart analyze lib/storage/waffra_accounts_portable_backup_v3.dart lib/storage/waffra_accounts_repository.dart lib/storage/waffra_accounts_schema.dart lib/storage/waffra_portable_encrypted_backup_exporter.dart lib/storage/waffra_unified_finance_writer.dart lib/storage/waffra_verified_accounts_api.dart lib/waffra_account_transaction_form.dart lib/waffra_accounts_manager_page.dart test/storage/m440_accounts_portable_v3_test.dart test/storage/m440_account_linked_entry_writer_test.dart test/storage/m447_account_recurring_atomic_test.dart
      - name: Verify bank-SMS account selection and source isolation
        run: python3 -m unittest discover -s test/qa -p 'm447_verified_sms_account_linking_test.py' -v
      - name: Run atomic SQLCipher accounts, SMS and V3 backup regression
        run: |
          flutter test test/storage/m440_accounts_repository_test.dart test/storage/m440_account_linked_entry_writer_test.dart test/storage/m440_accounts_backup_guard_test.dart test/storage/m440_accounts_migration_preview_test.dart test/storage/m440_accounts_portable_v3_test.dart test/m440_account_transaction_form_test.dart test/storage/m447_account_recurring_atomic_test.dart
