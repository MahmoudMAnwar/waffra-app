name: Waffra M85 Goals Trash Recovery Boundaries

on:
  pull_request:
    paths:
      - 'test/storage/m85_goal_recycle_boundary_test.dart'
      - '.github/workflows/m85-independent-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-acceptance:
    name: M85 30-day goal trash, opt-in purge and cold reopen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static-analyze acceptance tests
        run: dart analyze test/storage/m85_goal_recycle_boundary_test.dart
      - name: Run isolated acceptance tests
        run: flutter test test/storage/m85_goal_recycle_boundary_test.dart --reporter expanded
