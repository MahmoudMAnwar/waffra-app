name: Waffra M103 Same-SHA Whole-App Release Certification

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'firestore.rules'
      - '.github/workflows/m103-same-sha-release-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-flutter-regression:
    name: Full Dart/Flutter source and complete unit/widget suite
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze actual Flutter app and storage
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run all discovered Flutter unit/widget tests
        run: flutter test test --reporter expanded
      - name: Publish precise tested commit
        run: echo "Exact tested commit $GITHUB_SHA"

  firestore-owner-rules:
    name: Owner E2EE authorization and key recovery rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/firebase/package.json
      - run: npm --prefix test/firebase install --no-audit --no-fund
      - name: Firebase Emulator only — never deploy production rules
        run: |
          ./test/firebase/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-waffra-rules-ci \
            'npm --prefix test/firebase test'

  source-provenance:
    name: Record source audit scope without claiming production readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect app + Android widget finance writers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'lib/main.dart',
            'lib/waffra_widget_capture.part.dart',
            'lib/storage/waffra_production_finance_source_guard.dart',
            'lib/storage/waffra_production_finance_routing_gate.dart',
            'lib/storage/waffra_encrypted_finance_session.dart',
            'lib/storage/waffra_portable_encrypted_vault_restorer.dart',
            'lib/storage/waffra_cloud_recovery_manifest.dart',
            'lib/storage/waffra_cloud_manifest_last_outbox_drain.dart',
            'firestore.rules',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing critical release sources: '+','.join(missing))
          widget = Path(required[1]).read_text()
          app = Path(required[0]).read_text()
          print('Source snapshot:', __import__('os').environ['GITHUB_SHA'])
          print('Home legacy source remains:', 'SharedPreferences' in app)
          print('Widget legacy source remains:', 'SharedPreferences' in widget)
          print('Release merge/deploy is subject to independent 24-route audit.')
          PY
