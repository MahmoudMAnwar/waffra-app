name: Waffra M86 Recurring Schedule Boundaries

on:
  pull_request:
    paths:
      - 'test/m86_recurring_schedule_boundary_test.dart'
      - '.github/workflows/m86-independent-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-acceptance:
    name: M86 recurring due dates, postponements and money arithmetic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static-analyze acceptance tests
        run: dart analyze test/m86_recurring_schedule_boundary_test.dart
      - name: Run isolated acceptance tests
        run: flutter test test/m86_recurring_schedule_boundary_test.dart --reporter expanded
