name: M287 Arabic English Receipt OCR Acceptance (No Production Cutover)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m287-receipt-ocr.yml'
      - 'lib/waffra_receipt_ocr.dart'
      - 'lib/waffra_receipt_ocr_parser.dart'
      - 'lib/waffra_practical_tools_page.dart'
      - 'pubspec.yaml'
      - 'assets/tessdata_config.json'
      - 'test/m287_receipt_ocr_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m287-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bilingual-receipt-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve production OCR native dependency
        run: flutter pub get
      - name: Analyze scanner, parser, UI and tests
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/waffra_receipt_ocr.dart \
            lib/waffra_receipt_ocr_parser.dart \
            lib/waffra_practical_tools_page.dart \
            test/m287_receipt_ocr_test.dart \
            test/m281_practical_tools_test.dart
      - name: Bilingual receipts, OCR errors and historical tool regressions
        run: |
          flutter test --reporter expanded \
            test/m287_receipt_ocr_test.dart \
            test/m281_practical_tools_test.dart
      - name: Ensure OCR does not upload pictures or auto-write ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          service=Path('lib/waffra_receipt_ocr.dart').read_text()
          ui=Path('lib/waffra_practical_tools_page.dart').read_text()
          pubspec=Path('pubspec.yaml').read_text()
          assert 'flutter_tesseract_ocr: ^0.4.31' in pubspec
          assert "language: 'ara+eng'" in service
          assert '_sourceCommit' in service and '_matchesModel' in service
          assert "raw.githubusercontent.com" in service
          assert "response.bodyBytes" in service
          assert "await WaffraReceiptOcr.scan(file.path)" in ui
          assert "receiptOcrBusy" in ui and "m287-ocr-result" in ui
          assert "WaffraReceiptReviewDraft" in ui
          assert "Firebase" not in service and "Firestore" not in service
          assert "persist(" not in service and "createTransaction" not in service
          print('OCR language model downloads hashed; image recognition local, no auto-save.')
          PY
