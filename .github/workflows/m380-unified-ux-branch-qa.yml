name: M380 Feature Branch UX and Finance QA (no main merge)
on:
  push:
    branches:
      - feature/m380-unified-ux-business-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m380-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact-commit verification
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Source contract checks
        run: |
          python3 scripts/qa/m340_financial_quality_gate.py --json
      - name: User-approved UX and budget source regression
        run: |
          flutter test --reporter expanded \
            test/m359_budget_directory_and_templates_test.dart \
            test/m360_budget_category_quick_actions_test.dart \
            test/m357_budget_hierarchy_and_filter_layout_test.dart \
            test/m371_goal_wallet_and_budgets_regression_test.dart \
            test/m380_unified_ux_budget_goal_regression_test.dart
      - name: Complete Flutter test suite
        run: flutter test test/ --reporter expanded

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify no Dart analysis errors
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

  exact-sha-verdict:
    runs-on: ubuntu-latest
    if: always()
    needs: [source-and-unit, analyze]
    steps:
      - name: Fail if either mandatory gate did not pass
        env:
          UNIT: ${{ needs.source-and-unit.result }}
          ANALYSIS: ${{ needs.analyze.result }}
        run: |
          echo "M380 source revision: ${{ github.sha }}"
          echo "Full tests: $UNIT; Analyze: $ANALYSIS"
          test "$UNIT" = success
          test "$ANALYSIS" = success
          echo "Source-level PASS only; physical-device/data upgrade remains mandatory."
