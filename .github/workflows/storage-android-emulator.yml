name: Waffra Android Encrypted Storage Integration

on:
  pull_request:
    paths:
      - 'lib/storage/**'
      - 'integration_test/encrypted_storage_android_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/storage-android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waffra-storage-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-storage-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate temporary Android platform project
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Java 8 core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Run Dart storage analyzer
        run: dart analyze lib/storage integration_test/encrypted_storage_android_test.dart
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real Android emulator and verify encrypted vault
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: flutter test integration_test/encrypted_storage_android_test.dart -d emulator-5554 --reporter expanded
