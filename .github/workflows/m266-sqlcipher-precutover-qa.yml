name: M266 SQLCipher Widget Source Safety + Android QA (NO CUTOVER)

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/waffra_widget_capture.part.dart'
      - 'lib/main.dart'
      - 'test/storage/m266_home_bound_source_regression_test.dart'
      - 'test/storage/m266_widget_source_fail_closed_ui_test.dart'
      - '.github/workflows/m266-sqlcipher-precutover-qa.yml'
      - '.github/scripts/run-m202-sqlcipher-binder-android.sh'
      - '.github/workflows/m147-final-main-review-gate.yml'
      - 'scripts/qa/m266_main_scope_review.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m266-no-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  widget-and-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Match the exact reviewed SHA
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py
      - name: Analyze fail-closed Widget UI regression
        run: dart analyze test/storage/m266_widget_source_fail_closed_ui_test.dart test/storage/m266_home_bound_source_regression_test.dart
      - name: Exercise widget UI, legacy guard and all-24-route negative acceptance
        run: |
          flutter test --reporter expanded \
            test/storage/m266_home_bound_source_regression_test.dart \
            test/storage/m266_widget_source_fail_closed_ui_test.dart \
            test/waffra_widget_quick_capture_test.dart \
            test/storage/live_legacy_finance_guard_test.dart \
            test/storage/m165_no_auto_cutover_security_test.dart \
            test/storage/m201_24_route_no_false_production_proof_test.dart \
            test/storage/production_finance_authority_binding_test.dart
      - name: Assert activation still requires independent release approval
        run: |
          grep -F 'bool get automaticallyActivateSqlCipher => false;' lib/storage/waffra_production_cutover_release_gate.dart
          grep -F 'all_live_writers_not_yet_routed' lib/storage/waffra_production_finance_source_guard.dart
          test -f docs/qa/sqlcipher-cutover-readiness-20261027.md

  android-sqlcipher-disposable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check fail-closed Android test runner shell syntax
        run: |
          bash -n .github/scripts/run-m202-sqlcipher-binder-android.sh
          grep -F 'flutter drive' .github/scripts/run-m202-sqlcipher-binder-android.sh
          grep -F 'M202_ANDROID_TEST_PASS' .github/scripts/run-m202-sqlcipher-binder-android.sh
      - name: Pin original source guard
        run: |
          grep -F 'bool get automaticallyActivateSqlCipher => false;' lib/storage/waffra_production_cutover_release_gate.dart
          grep -F 'all_live_writers_not_yet_routed' lib/storage/waffra_production_finance_source_guard.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare disposable Android build
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Enable Android library desugaring for disposable CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          assert 'compileOptions {' in s
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          decl='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if decl not in s:
              s+='\ndependencies {\n    '+decl+'\n}\n'
          p.write_text(s)
          PY
      - run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py
      # Flutter's generated Android project requires NDK 28.2.13676358.
      # Preflight it before booting the emulator; a partially downloaded NDK
      # can otherwise surface as a misleading integration-test failure.
      - name: Install and verify required Android NDK with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=28.2.13676358
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          for attempt in 1 2 3; do
            if test -f "$sdk_root/ndk/$ndk_version/source.properties" &&
              grep -q "Pkg.Revision = $ndk_version" "$sdk_root/ndk/$ndk_version/source.properties"; then
              break
            fi
            echo "NDK $ndk_version installation attempt $attempt/3"
            rm -rf "$sdk_root/ndk/$ndk_version"
            "$sdkmanager" --sdk_root="$sdk_root" "ndk;$ndk_version" || true
            if test -f "$sdk_root/ndk/$ndk_version/source.properties" &&
              grep -q "Pkg.Revision = $ndk_version" "$sdk_root/ndk/$ndk_version/source.properties"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Android NDK installation failed; blocking real Android QA" >&2
              exit 1
            fi
          done
          test -x "$sdk_root/ndk/$ndk_version/ndk-build"
      - name: Enable KVM on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android SQLCipher Home/Widget, migration and receipt integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash .github/scripts/run-m202-sqlcipher-binder-android.sh
      - name: Confirm emulator scope is NOT certified production
        if: success()
        run: |
          echo 'ANDROID_EMULATOR_QA_ONLY_NO_PRODUCTION_CUTOVER'
          grep -F 'bool get automaticallyActivateSqlCipher => false;' lib/storage/waffra_production_cutover_release_gate.dart
