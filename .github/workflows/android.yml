name: Build Waffra Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=waffra .

      - name: Configure Android biometric authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android')
          manifest = android / 'app/src/main/AndroidManifest.xml'
          if not manifest.exists():
              raise SystemExit('Missing generated AndroidManifest.xml')
          xml = manifest.read_text()
          for permission in ('USE_BIOMETRIC', 'USE_FINGERPRINT'):
              entry = f'<uses-permission android:name="android.permission.{permission}" />'
              if entry not in xml:
                  xml = xml.replace('<application', '    ' + entry + '\n    <application', 1)
          manifest.write_text(xml)

          kotlin = list((android / 'app/src/main/kotlin').rglob('MainActivity.kt'))
          java = list((android / 'app/src/main/java').rglob('MainActivity.java'))
          if kotlin:
              activity = kotlin[0]
              original = activity.read_text()
              import re
              package_match = re.search(r'^\s*package\s+([\w.]+)', original, re.MULTILINE)
              if not package_match:
                  raise SystemExit('Cannot determine Kotlin MainActivity package')
              package_name = package_match.group(1)
              source = (
                  f'package {package_name}\n\n'
                  'import android.os.Bundle\n'
                  'import android.view.WindowManager\n'
                  'import io.flutter.embedding.android.FlutterFragmentActivity\n'
                  'import io.flutter.embedding.engine.FlutterEngine\n'
                  'import io.flutter.plugin.common.MethodChannel\n\n'
                  'class MainActivity : FlutterFragmentActivity() {\n'
                  '    private val privacyChannel = "waffra/privacy"\n'
                  '    private fun applyScreenshotSetting(allowed: Boolean) {\n'
                  '        if (allowed) window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '        else window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '    }\n'
                  '    override fun onCreate(savedInstanceState: Bundle?) {\n'
                  '        super.onCreate(savedInstanceState)\n'
                  '        val prefs = getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)\n'
                  '        applyScreenshotSetting(prefs.getBoolean("flutter.waffra_allow_screenshots", true))\n'
                  '    }\n'
                  '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n'
                  '        super.configureFlutterEngine(flutterEngine)\n'
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, privacyChannel)\n'
                  '            .setMethodCallHandler { call, result ->\n'
                  '                if (call.method == "setScreenshotsAllowed") {\n'
                  '                    val allowed = call.arguments as? Boolean ?: false\n'
                  '                    applyScreenshotSetting(allowed)\n'
                  '                    result.success(null)\n'
                  '                } else result.notImplemented()\n'
                  '            }\n'
                  '    }\n'
                  '}\n'
              )
              activity.write_text(source)
              assert 'FLAG_SECURE' in activity.read_text()
              print('Configured secure Kotlin activity:', activity)
          elif java:
              activity = java[0]
              source = activity.read_text()
              source = source.replace('import io.flutter.embedding.android.FlutterActivity;',
                                      'import android.os.Bundle;\\nimport android.view.WindowManager;\\nimport io.flutter.embedding.android.FlutterFragmentActivity;')
              source = source.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              source = source.replace('extends FlutterFragmentActivity {',
                  'extends FlutterFragmentActivity {\\n'
                  '    @Override public void onCreate(Bundle savedInstanceState) {\\n'
                  '        super.onCreate(savedInstanceState);\\n'
                  '        getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);\\n'
                  '    }')
              if 'FLAG_SECURE' not in source:
                  raise SystemExit('Could not secure Java MainActivity')
              activity.write_text(source)
              print('Configured secure Java activity:', activity)
          else:
              raise SystemExit('Could not find MainActivity')

          # local_auth requires an AppCompat-based theme for older Android versions.
          for styles in android.glob('app/src/main/res/values*/styles.xml'):
              content = styles.read_text()
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              styles.write_text(content)
              print('Configured', styles)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Test Saudi bank SMS importer
        run: flutter test test/bank_sms_test.dart

      - name: Generate Waffra app icon
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Waffra APK
        uses: actions/upload-artifact@v4
        with:
          name: Waffra-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
