# Waffra ARM64 release rebuild requested 2026-10-19 - retry missing artifact
# Re-trigger optimized ARM64 build; preserve Tajawal typography
name: Build Waffra Android APK

on:
  push:
    branches:
      - main
      # M206 on-branch QA build; no merge, store deploy or SQLCipher activation.
      - 'fix/m206-daylight-tour-sms-notes-motion-20261024'
      # M259 signed owner-only QA; never Google Play or SQLCipher cutover.
      - 'feature/m259-approved-markets-oil-accordion-refresh-20261026'
      # M160 signed APK for owner physical-device QA only; no store release.
      - 'integration/m160-reconcile-main-m158-release-gate-20261023'
      - 'feature/storage-finance-startup-recovery-m62'
      - 'feature/storage-verified-backup-restore-m63'
      - 'feature/storage-encrypted-receipt-view-m66'
      - 'feature/combined-finance-cloud-validation-m70'
      - 'feature/m99-production-sync-queue-and-android-build'
      - 'feature/waffra-unified-finance-release-candidate'
      - 'feature/m106-play-privacy-observability-readiness'
      - 'feature/m107-production-account-delete-observability'
      - 'feature/m108-unified-home-widget-finance-commit'
      - 'feature/m109-verified-finance-authority-dispatch'
      - 'feature/m110-home-finance-writer-source-authority'
      # M124: signed pre-merge APK/AAB candidate from the exact cumulative
      # branch, never a production store deployment or SQLCipher activation.
      - 'feature/m124-main-integration-merge-preview'
      # M127: isolated signed QA artifact only; never auto-release or deploy.
      - 'feature/m127-approved-ui-and-safe-backup-build'
  workflow_dispatch:

# Fast-build concurrency: only the latest pushed revision needs an APK.
# Separate full-smoke workflow runs independently without skipped steps.
concurrency:
  group: waffra-android-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify-all-tests:
    name: Full mandatory Flutter and Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter with dependency cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py
      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run every Flutter regression including future test files
        run: flutter test --reporter expanded
      - name: Run incremental-CI safety policy tests
        run: python3 -m unittest discover -s scripts -p 'test_smart_ci.py' -v
      - name: Run every Python QA test including future test files
        run: python3 -m unittest discover -s test/qa -p '*_test.py' -v

  verify-same-sha-checks:
    name: Check every independent test workflow on this exact SHA
    needs: verify-all-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Fail closed on missing, running or failed independent tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repo, sha = os.environ['REPO'], os.environ['TARGET_SHA']
          own_run = int(os.environ['RUN_ID'])
          branch = os.environ['BRANCH_NAME']
          expected = {
              'M147 Final Main-Safe Merge Readiness Review',
              'M160 Main Reconciliation and Backup Regression',
              'Waffra Full Offline Finance and UI Regression',
              'Waffra M103 Same-SHA Whole-App Release Certification',
              'M202 Android SQLCipher Source Binding Dry Run (CI ONLY)',
          } if branch == 'fix/m206-daylight-tour-sms-notes-motion-20261024' else set()
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.monotonic() + 45 * 60
          while True:
              page, found = 1, []
              while True:
                  qs = urllib.parse.urlencode({'head_sha': sha, 'per_page': 100, 'page': page})
                  url = f'https://api.github.com/repos/{repo}/actions/runs?{qs}'
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as response:
                      chunk = json.load(response)['workflow_runs']
                  found.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise SystemExit('BLOCKED: too many CI runs to audit')
              checks = {}
              for item in sorted(found, key=lambda x: (x['created_at'], x['id']), reverse=True):
                  if item['id'] != own_run and item['head_sha'] == sha:
                      checks.setdefault(item['name'], item)
              missing = sorted(expected - checks.keys())
              pending = [n for n, v in checks.items() if v['status'] != 'completed']
              failed = [(n, v['conclusion'], v['html_url']) for n, v in checks.items()
                        if v['status'] == 'completed' and v['conclusion'] != 'success']
              if failed:
                  for item in failed:
                      print('BLOCKED failed external CI:', item, flush=True)
                  raise SystemExit('No APK: at least one same-SHA workflow failed')
              if not missing and not pending:
                  print('CI PASS: all', len(checks), 'same-SHA external workflows succeeded', flush=True)
                  break
              print('CI pending:', pending, 'missing:', missing, flush=True)
              if time.monotonic() >= deadline:
                  raise SystemExit('BLOCKED: required same-SHA CI never finished')
              time.sleep(30)
          PY

  build:
    needs: [verify-all-tests, verify-same-sha-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed to prove approved notes are not older than app-code changes.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (SDK and pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache the Gradle wrapper, dependency downloads and generated Gradle
      # accessors across clean GitHub runners (Flutter cache alone does not).
      # setup-gradle manages cache keys and cleanup; never cache signed APKs.
      - name: Restore Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # Restore Gradle's task output cache across ephemeral GitHub runners.
      # This is not an APK cache: each build still produces, signs and verifies
      # a fresh APK. Keys include the toolchain and dependency lockfiles.
      - name: Restore incremental Gradle task outputs
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: waffra-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            waffra-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Enable Gradle task output caching
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.configuration-cache=false' >> ~/.gradle/gradle.properties

      - name: Generate Android project (without duplicate pub get)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .

      - name: Configure optional approximate location only (no background or SMS)
        run: python3 scripts/qa/m290_configure_country_permissions.py .

      - name: Match native Android launch background to Waffra emerald
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main/res')
          for drawable in root.glob('drawable*/launch_background.xml'):
              xml=drawable.read_text()
              # Keep the native startup window emerald instead of black/white.
              xml=re.sub(r'<item android:drawable="@android:color/white"\s*/>',
                         '<item android:drawable="@color/waffra_launch_bg" />',xml)
              drawable.write_text(xml)
          values=root/'values'
          values.mkdir(exist_ok=True)
          (values/'waffra_launch_colors.xml').write_text(
              '<resources><color name="waffra_launch_bg">#002E25</color></resources>')
          for stylefile in root.glob('values*/styles.xml'):
              xml=stylefile.read_text()
              # Android 12+ system splash uses this color before Flutter draws.
              if 'windowSplashScreenBackground' not in xml:
                  xml=xml.replace('<style name="LaunchTheme"',
                      '<style name="LaunchTheme"',1)
                  xml=re.sub(r'(<style name="LaunchTheme"[^>]*>)',
                      r'\1\n        <item name="android:windowSplashScreenBackground">#002E25</item>'
                      if 'values-v31' in str(stylefile) else r'\1',xml,count=1)
              stylefile.write_text(xml)
          print('Native Waffra launch background configured')
          PY

      - name: Configure Firebase Google Sign-In
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil
          source=Path('firebase/google-services.json')
          data=json.loads(source.read_text())
          assert data['project_info']['project_id']=='waffra-app'
          assert any(c['client_info']['android_client_info']['package_name']=='com.waffra.app' for c in data['client'])
          # Flutter create --org com.waffra --project-name waffra generates
          # com.waffra.waffra. Keep the existing generated package identity
          # aligned with Firebase's registered com.waffra.app client.
          app_gradle=Path('android/app/build.gradle.kts')
          gradle=app_gradle.read_text()
          if 'com.waffra.waffra' not in gradle:
              raise SystemExit('Unexpected generated Android applicationId; refusing blind replacement')
          gradle=gradle.replace('com.waffra.waffra','com.waffra.app')
          app_gradle.write_text(gradle)
          dest=Path('android/app/google-services.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source,dest)
          settings=Path('android/settings.gradle.kts')
          app=Path('android/app/build.gradle.kts')
          if not settings.exists() or not app.exists():
              raise SystemExit('Expected generated Kotlin Gradle files')
          s=settings.read_text()
          plugin='id("com.google.gms.google-services") version "4.4.2" apply false'
          if 'com.google.gms.google-services' not in s:
              s=s.replace('plugins {','plugins {'+chr(10)+'    '+plugin,1)
          settings.write_text(s)
          a=app.read_text()
          if 'id("com.google.gms.google-services")' not in a:
              a=a.replace('plugins {','plugins {'+chr(10)+'    id("com.google.gms.google-services")',1)
          app.write_text(a)
          print('Firebase Android configuration installed')
          PY

      - name: Force Firebase Crashlytics OFF before native app startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          if 'firebase_crashlytics_collection_enabled' in xml:
              raise SystemExit('Crashlytics collection flag already exists; audit required')
          match=re.search(r'<application\b[^>]*>',xml)
          if match is None:
              raise SystemExit('Android application element not found')
          privacy='<meta-data android:name="firebase_crashlytics_collection_enabled" android:value="false" />'
          xml=xml[:match.end()]+'\n        '+privacy+xml[match.end():]
          manifest.write_text(xml)
          settings=Path('android/settings.gradle.kts')
          plugins=settings.read_text()
          signature='id("com.google.firebase.crashlytics") version "3.0.6" apply false'
          if 'com.google.firebase.crashlytics' not in plugins:
              plugins=plugins.replace('plugins {','plugins {\n    '+signature,1)
          settings.write_text(plugins)
          app=Path('android/app/build.gradle.kts')
          gradle=app.read_text()
          if 'id("com.google.firebase.crashlytics")' not in gradle:
              gradle=gradle.replace('plugins {',
                  'plugins {\n    id("com.google.firebase.crashlytics")',1)
          app.write_text(gradle)
          assert privacy in manifest.read_text()
          print('Native Firebase Crashlytics collection disabled by default')
          PY

      - name: Configure Android biometric authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android')
          manifest = android / 'app/src/main/AndroidManifest.xml'
          if not manifest.exists():
              raise SystemExit('Missing generated AndroidManifest.xml')
          xml = manifest.read_text()
          for permission in ('INTERNET', 'USE_BIOMETRIC', 'USE_FINGERPRINT'):
              entry = f'<uses-permission android:name="android.permission.{permission}" />'
              if entry not in xml:
                  xml = xml.replace('<application', '    ' + entry + '\n    <application', 1)
          manifest.write_text(xml)

          kotlin = list((android / 'app/src/main/kotlin').rglob('MainActivity.kt'))
          java = list((android / 'app/src/main/java').rglob('MainActivity.java'))
          if kotlin:
              activity = kotlin[0]
              original = activity.read_text()
              import re
              package_match = re.search(r'^\s*package\s+([\w.]+)', original, re.MULTILINE)
              if not package_match:
                  raise SystemExit('Cannot determine Kotlin MainActivity package')
              package_name = 'com.waffra.app'  # Must match Firebase applicationId and manifest activity
              source = (
                  f'package {package_name}\n\n'
                  'import android.os.Bundle\n'
                  'import android.view.WindowManager\n'
                  'import io.flutter.embedding.android.FlutterFragmentActivity\n'
                  'import io.flutter.embedding.engine.FlutterEngine\n'
                  'import io.flutter.plugin.common.MethodChannel\n\n'
                  'class MainActivity : FlutterFragmentActivity() {\n'
                  '    private val privacyChannel = "waffra/privacy"\n'
                  '    private fun applyScreenshotSetting(allowed: Boolean) {\n'
                  '        if (allowed) window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '        else window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '    }\n'
                  '    override fun onCreate(savedInstanceState: Bundle?) {\n'
                  '        super.onCreate(savedInstanceState)\n'
                  '        val prefs = getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)\n'
                  '        applyScreenshotSetting(prefs.getBoolean("flutter.waffra_allow_screenshots", true))\n'
                  '    }\n'
                  '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n'
                  '        super.configureFlutterEngine(flutterEngine)\n'
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, privacyChannel)\n'
                  '            .setMethodCallHandler { call, result ->\n'
                  '                if (call.method == "setScreenshotsAllowed") {\n'
                  '                    val allowed = call.arguments as? Boolean ?: false\n'
                  '                    applyScreenshotSetting(allowed)\n'
                  '                    result.success(null)\n'
                  '                } else result.notImplemented()\n'
                  '            }\n'
                  '    }\n'
                  '}\n'
              )
              activity.write_text(source)
              assert 'FLAG_SECURE' in activity.read_text()
              print('Configured secure Kotlin activity:', activity)
          elif java:
              activity = java[0]
              source = activity.read_text()
              source = source.replace('import io.flutter.embedding.android.FlutterActivity;',
                                      'import android.os.Bundle;\\nimport android.view.WindowManager;\\nimport io.flutter.embedding.android.FlutterFragmentActivity;')
              source = source.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              source = source.replace('extends FlutterFragmentActivity {',
                  'extends FlutterFragmentActivity {\\n'
                  '    @Override public void onCreate(Bundle savedInstanceState) {\\n'
                  '        super.onCreate(savedInstanceState);\\n'
                  '        getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);\\n'
                  '    }')
              if 'FLAG_SECURE' not in source:
                  raise SystemExit('Could not secure Java MainActivity')
              activity.write_text(source)
              print('Configured secure Java activity:', activity)
          else:
              raise SystemExit('Could not find MainActivity')

          # local_auth requires an AppCompat-based theme for older Android versions.
          for styles in android.glob('app/src/main/res/values*/styles.xml'):
              content = styles.read_text()
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              styles.write_text(content)
              print('Configured', styles)
          PY

      - name: Install native messaging share support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          activity_files=list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if len(activity_files)!=1:
              raise SystemExit(f'Expected one Kotlin MainActivity, got {len(activity_files)}')
          activity=activity_files[0]
          template=Path('native/WaffraMainActivity.kt').read_text()
          assert 'waffra/privacy' in template and 'waffra/messages' in template
          activity.write_text(template)

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          if 'android.intent.action.SEND' not in xml:
              filter_xml = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
              '''
              start=xml.find('<activity')
              close=xml.find('</activity>',start)
              if start<0 or close<0 or 'MainActivity' not in xml[start:close]:
                  raise SystemExit('Could not locate generated MainActivity')
              xml=xml[:close]+filter_xml+chr(10)+'    '+xml[close:]
              manifest.write_text(xml)
          if re.search(r'<uses-permission[^>]*\\b(?:READ_SMS|RECEIVE_SMS|READ_CALL_LOG)\\b',xml):
              raise SystemExit('SMS inbox permissions must never be requested')
          print('Enabled user-triggered text sharing and messaging launch without inbox access')
          PY

      - name: Install native Firebase Auth SDK dependency (M219)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          kotlin=p.read_text()
          if 'com.google.firebase:firebase-auth' not in kotlin:
              kotlin += '''
          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.0.0"))
              implementation("com.google.firebase:firebase-auth")
          }
          '''
              p.write_text(kotlin)
          PY

      - name: Install compact circular widget and transparent quick-capture screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/app/src/main')
          activity=list((root/'kotlin').rglob('MainActivity.kt'))
          assert len(activity)==1, 'Missing Waffra MainActivity'
          kotlin=activity[0].parent
          assert 'waffra/widget' in activity[0].read_text()
          for filename in ('WaffraWidget.kt','WaffraQuickActivity.kt'):
              (kotlin/filename).write_text((Path('native')/filename).read_text())
          layout=root/'res/layout'
          layout.mkdir(parents=True,exist_ok=True)
          (layout/'waffra_widget.xml').write_text("""<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/waffra_widget_root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:padding="0dp">
              <!-- Android launcher cells may be tall. Draw inside a fixed
                   square so oval background cannot stretch to an ellipse. -->
              <FrameLayout android:id="@+id/waffra_widget_circle"
                  android:layout_width="80dp" android:layout_height="80dp"
                  android:layout_gravity="center"
                  android:background="@drawable/waffra_widget_bg">
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent"
                  android:gravity="center" android:orientation="vertical"
                  android:padding="4dp">
                  <TextView android:id="@+id/widget_sparkle"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="✦" android:gravity="center" android:textColor="#FFFFFF" android:textSize="12sp"/>
                  <TextView android:id="@+id/widget_balance" android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:text="0.00"
                      android:textSize="14sp" android:textStyle="bold" android:gravity="center"
                      android:singleLine="true" android:autoSizeTextType="uniform"
                      android:autoSizeMinTextSize="6sp" android:autoSizeMaxTextSize="14sp"
                      android:autoSizeStepGranularity="1sp"
                      android:textColor="#B8F5D6"/>
                  <TextView android:id="@+id/widget_currency"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="ريال" android:textColor="#FFFFFF"
                      android:textSize="10sp" android:singleLine="true"
                      android:gravity="center" />
              </LinearLayout>
              </FrameLayout>
          </FrameLayout>""")
          drawable=root/'res/drawable'
          drawable.mkdir(parents=True,exist_ok=True)
          (drawable/'waffra_widget_bg.xml').write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#064D3B"/>
              <stroke android:width="1dp" android:color="#42C991"/>
          </shape>""")
          info=root/'res/xml'
          info.mkdir(parents=True,exist_ok=True)
          (info/'waffra_widget_info.xml').write_text("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="80dp" android:minHeight="80dp"
              android:targetCellWidth="1" android:targetCellHeight="1"
              android:initialLayout="@layout/waffra_widget"
              android:resizeMode="none" android:widgetCategory="home_screen"
              android:updatePeriodMillis="1800000"/>
          """)
          style=root/'res/values/styles.xml'
          xml=style.read_text()
          if 'WaffraWidgetTheme' not in xml:
              xml=xml.replace('</resources>', """
              <style name="WaffraWidgetTheme" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
              </resources>""")
              style.write_text(xml)
          manifest=root/'AndroidManifest.xml'
          xml=manifest.read_text()
          if 'com.waffra.app.WaffraWidget' not in xml:
              xml=xml.replace('</application>',"""
              <receiver android:name="com.waffra.app.WaffraWidget"
                  android:exported="true" android:label="Waffra • وفرة">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider"
                      android:resource="@xml/waffra_widget_info"/>
              </receiver>
              <activity android:name="com.waffra.app.WaffraQuickActivity"
                  android:theme="@style/WaffraWidgetTheme"
                  android:exported="false" android:hardwareAccelerated="true"
                  android:windowSoftInputMode="adjustResize"/>
              </application>""",1)
          manifest.write_text(xml)
          assert 'WaffraQuickActivity' in xml and 'WaffraWidget' in xml
          print('Circular 1x1 Waffra widget and translucent quick capture activity configured')
          PY

      - name: Configure Android scheduled notification support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          for permission in ('POST_NOTIFICATIONS','RECEIVE_BOOT_COMPLETED'):
              entry=f'<uses-permission android:name="android.permission.{permission}" />'
              if entry not in xml:
                  xml=xml.replace('<application','    '+entry+'\n    <application',1)
          if 'ScheduledNotificationReceiver' not in xml:
              receivers = '''
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              '''
              xml=xml.replace('</application>',receivers+'\n    </application>',1)
          manifest.write_text(xml)
          kt=Path('android/app/build.gradle.kts')
          groovy=Path('android/app/build.gradle')
          if kt.exists():
              source=kt.read_text()
              source=source.replace('compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
              source+='\n// Required by flutter_local_notifications\ndependencies {\n'
              source+='    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kt.write_text(source)
          elif groovy.exists():
              source=groovy.read_text()
              source=source.replace('compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true',1)
              source+="\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\n"
              groovy.write_text(source)
          else:
              raise SystemExit('Missing Android Gradle app file')
          print('Configured Android receivers and Java API desugaring')
          PY

      - name: Preserve SharedPreferences Android plugin in Release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('android/app')
          kt = app / 'build.gradle.kts'
          groovy = app / 'build.gradle'
          if kt.exists():
              path = kt
              source = path.read_text()
              needle = 'buildTypes {'
              if needle not in source:
                  raise SystemExit('Cannot find Android Kotlin buildTypes')
              source = source.replace(needle, needle + '''
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              ''', 1)
          elif groovy.exists():
              path = groovy
              source = path.read_text()
              needle = 'buildTypes {'
              if needle not in source:
                  raise SystemExit('Cannot find Android Groovy buildTypes')
              source = source.replace(needle, needle + '''
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              ''', 1)
          else:
              raise SystemExit('Cannot find Android app Gradle build file')
          path.write_text(source)
          print('Disabled R8 shrinking and obfuscation for Release:', path)
          print('Keeping ARM64 and Flutter Dart tree shaking enabled')
          PY

      # Release builds must use the Firebase-registered production certificate.
      # Decode only on the runner; never commit the private signing key.
      - name: Configure and validate Waffra release signing
        shell: bash
        env:
          WAFFRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.WAFFRA_RELEASE_KEYSTORE_BASE64 }}
          WAFFRA_RELEASE_STORE_PASSWORD: ${{ secrets.WAFFRA_RELEASE_STORE_PASSWORD }}
          WAFFRA_RELEASE_KEY_PASSWORD: ${{ secrets.WAFFRA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WAFFRA_RELEASE_KEYSTORE_BASE64 WAFFRA_RELEASE_STORE_PASSWORD WAFFRA_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is missing or empty"
              exit 1
            fi
          done
          umask 077
          if ! printf '%s' "$WAFFRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/waffra-release.jks; then
            echo "::error::Signing keystore Base64 cannot be decoded"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          key = Path('android/app/waffra-release.jks')
          if key.stat().st_size < 500:
              sys.exit('Signing keystore is unexpectedly small')
          result = subprocess.run(
              ['keytool', '-list', '-v', '-storetype', 'JKS', '-keystore', str(key),
               '-alias', 'waffra-release', '-storepass:env', 'WAFFRA_RELEASE_STORE_PASSWORD'],
              text=True, capture_output=True)
          if result.returncode:
              sys.exit('FAIL: cannot unlock the release keystore with the stored password, or signing alias is missing')
          if 'PrivateKeyEntry' not in result.stdout:
              sys.exit('FAIL: signing alias is not a private key entry')
          expected = {
              'SHA1': '7B:65:B9:0C:A5:1C:0D:EC:5D:36:CB:AB:1A:F7:89:11:9D:9B:43:35',
              'SHA256': '89:4C:43:6D:C4:27:0D:46:81:57:07:A2:91:47:70:9E:89:CD:42:D4:0F:BF:5D:3A:E2:41:04:29:3B:03:AE:8C',
          }
          for label, fingerprint in expected.items():
              match = re.search(r'\b' + label + r':\s*([0-9A-Fa-f:]+)', result.stdout)
              if not match or match.group(1).lower() != fingerprint.lower():
                  sys.exit('FAIL: release signing ' + label + ' does not match the certificate registered in Firebase')
              print('Verified release signing', label + ':', match.group(1))

          gradle_path = Path('android/app/build.gradle.kts')
          gradle = gradle_path.read_text()
          if gradle.count('buildTypes {') != 1:
              sys.exit('FAIL: cannot find a unique Android buildTypes block')
          gradle = gradle.replace('buildTypes {', '''signingConfigs {
                  create("waffraRelease") {
                      keyAlias = "waffra-release"
                      keyPassword = System.getenv("WAFFRA_RELEASE_KEY_PASSWORD")
                      storeFile = file("waffra-release.jks")
                      storePassword = System.getenv("WAFFRA_RELEASE_STORE_PASSWORD")
                  }
              }
              buildTypes {''', 1)
          gradle, n = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("waffraRelease")', gradle)
          if n != 1:
              sys.exit('FAIL: expected Flutter-generated release signingConfig not found')
          gradle_path.write_text(gradle)
          print('Configured Android release build to use validated Waffra private signing key')
          PY

      # Gradle's dependency cache is already active via setup-gradle.
      # Enable task output caching too; signed APKs and keystores are excluded.
      - name: Enable Gradle task output build cache
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradle.properties
          if ! grep -q '^org.gradle.caching=true$' android/gradle.properties; then
            printf '\norg.gradle.caching=true\n' >> android/gradle.properties
          fi
          grep -q '^org.gradle.caching=true$' android/gradle.properties
          echo 'Gradle task output caching enabled.'

      - name: Install dependencies
        run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py

      - name: Identify Flutter compilation-cache compatibility
        id: flutter_cache_identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['flutter','--version','--machine'],text=True))
          revision=data['frameworkRevision'][:16]
          engine=data['engineRevision'][:16]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'revision={revision}-{engine}\n')
          print('Flutter cache framework/engine:',revision,engine)
          PY

      # Cache only Flutter compilation intermediates. Flutter validates the
      # source/asset dependency graph for every actual release build.
      - name: Restore Flutter compilation intermediates
        id: flutter_compile_cache
        uses: actions/cache/restore@v4
        with:
          path: .dart_tool/flutter_build
          key: waffra-flutter-compile-v1-${{ runner.os }}-${{ steps.flutter_cache_identity.outputs.revision }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'native/**', 'firebase/google-services.json', '.github/workflows/android.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            waffra-flutter-compile-v1-${{ runner.os }}-${{ steps.flutter_cache_identity.outputs.revision }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'native/**', 'firebase/google-services.json', '.github/workflows/android.yml') }}-

      - name: Record Flutter compilation cache restore
        shell: bash
        env:
          CACHE_MATCH: ${{ steps.flutter_compile_cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$CACHE_MATCH" ]; then
            echo 'Flutter compilation intermediates: restored prior compatible cache.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Flutter compilation intermediates: cold start.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove Flutter-generated sample test and stale lint include
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sample = Path('test/widget_test.dart')
          if sample.exists() and 'MyApp' in sample.read_text():
              sample.unlink()
              print('Removed Flutter create default MyApp sample test')
          options = Path('analysis_options.yaml')
          if options.exists():
              data = options.read_text()
              data = data.replace('include: package:flutter_lints/flutter.yaml', '')
              options.write_text(data)
              print('Removed unresolved generated flutter_lints include')
          PY

      - name: Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      # Validate the cache invalidation logic itself on every build.
      - name: Verify Smart CI safety policies
        run: python3 -m unittest discover -s scripts -p 'test_smart_ci.py' -v

      # A test cache contains ONLY fingerprints and previous green results,
      # never compiled APKs or security secrets. An older successful full
      # release is used as the reference if the exact run has no cache.
      - name: Restore verified passing Flutter test fingerprints
        id: smart_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci_cache/waffra_green_tests.json
          key: waffra-smart-tests-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            waffra-smart-tests-v2-${{ runner.os }}-

      # Tests touching money, bank messages, due dates, security and backup
      # always run. Other tests run if their transitive source or environment
      # changed. Scheduled/full-smoke releases re-run ALL Flutter tests.
      - name: Run Smart Incremental Flutter tests
        id: smart_tests
        env:
          WAFFRA_FULL_VALIDATION: 'false'
        run: python3 scripts/smart_ci.py

      - name: Generate Waffra app icon
        run: dart run flutter_launcher_icons

      # Fast builds always run flutter analyze + flutter test + signed ARM64.
      # Full smoke is opt-in on workflow_dispatch and automatic nightly.
      # The hosted Android emulator uses x86_64, hence an extra x64 APK is
      # only compiled in full-smoke mode; it must not slow every push.
      # Upload only the final ARM64 APK for users.
      # Flutter's integration_test is a dev-only tool. Flutter create/pub
      # sometimes leave its Java registrar in the release source tree even
      # though the release classpath correctly excludes the test plugin.
      # Remove ONLY this debug test registration; keep production plugins.
      - name: Drop debug-only integration test registration for release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java')
          if not path.exists():
              print('No stale generated Java registrant on this SDK')
          else:
              text=path.read_text()
              statement='flutterEngine.getPlugins().add(new dev.flutter.plugins.integration_test.IntegrationTestPlugin());'
              if statement in text:
                  text=text.replace(statement,
                      '// integration_test is debug/test-only and not on the release classpath.')
                  path.write_text(text)
                  print('Excluded test-only registrar from release compilation')
              elif 'dev.flutter.plugins.integration_test.IntegrationTestPlugin()' in text:
                  raise SystemExit('Unexpected integration_test registrar form; fail safely')
              else:
                  print('No test-only integration plugin in Java registrar')
          PY

      # Identity is compiled *inside* the Android package so an external
      # text receipt alone cannot certify a stale or cached APK.
      - name: Stamp exact source revision into Android APK assets
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('android/app/src/main/assets/waffra-build-identity.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'commit_sha': os.environ['SOURCE_SHA'],
              'branch': os.environ['SOURCE_BRANCH'],
              'workflow_run': os.environ['SOURCE_RUN'],
              'build_type': 'qa-android-arm64',
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Build optimized ARM64 Release APK
        shell: bash
        env:
          WAFFRA_RELEASE_STORE_PASSWORD: ${{ secrets.WAFFRA_RELEASE_STORE_PASSWORD }}
          WAFFRA_RELEASE_KEY_PASSWORD: ${{ secrets.WAFFRA_RELEASE_KEY_PASSWORD }}
          # Public read-only commodity API key; never a bank credential.
          WAFFRA_PUBLIC_EIA_KEY: ${{ secrets.WAFFRA_PUBLIC_EIA_KEY }}
        run: |
          set -o pipefail
          started=$(date +%s)
          # Gradle/Maven occasionally answer 429 Too Many Requests on hosted
          # runners. Retry transient download failures rather than report
          # them as application or Dart compilation failures.
          eia_define=()
          if [[ -n "${WAFFRA_PUBLIC_EIA_KEY:-}" ]]; then
            # Official EIA route uses its own registered public read-only key.
            # Never print this key or include it in release notes.
            eia_define+=(--dart-define="WAFFRA_PUBLIC_EIA_KEY=${WAFFRA_PUBLIC_EIA_KEY}")
            echo "Official EIA live commodity source configured for release APK"
          else
            echo "::warning::WAFFRA_PUBLIC_EIA_KEY is not configured; oil quotes will depend on unkeyed FRED CSV availability"
          fi
          for attempt in 1 2 3 4; do
            echo "Android ARM64 build attempt ${attempt}/4"
            if flutter build apk --no-pub --release --target-platform android-arm64 --tree-shake-icons "${eia_define[@]}"; then
              elapsed=$(( $(date +%s) - started ))
              printf 'ARM64 build command: **%s seconds** (including retries, if any).\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
              echo "WAFFRA_ARM64_BUILD_SECONDS=$elapsed"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Android build failed after four attempts"
              exit 1
            fi
            sleep $((15 * attempt))
          done

      - name: Measure release APK size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/app/outputs/flutter-apk/app-release.apk')
          print(f'WAFFRA_ARM64_RELEASE_APK_MIB={p.stat().st_size / 1048576:.2f}')
          PY

      - name: Verify final APK uses Firebase-registered Waffra release signing
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          expected_sha1 = '7b65b90ca51c0dec5d36cbab1af789119d9b4335'
          expected_sha256 = '894c436dc4270d46815707a29147709e89cd42d40fbf5d3ae24104293b03ae8c'
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          found = subprocess.run(
              ['bash', '-lc', 'find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1'],
              text=True, capture_output=True, check=True).stdout.strip()
          if not found: sys.exit('FAIL: Android apksigner not found')
          result = subprocess.run([found, 'verify', '--print-certs', apk], text=True, capture_output=True)
          if result.returncode: sys.exit('FAIL: final APK signature verification failed')
          for label, expected in [('SHA-1', expected_sha1), ('SHA-256', expected_sha256)]:
              match = re.search(r'certificate ' + label + r' digest:\s*([0-9a-fA-F:]+)', result.stdout)
              if not match or match.group(1).replace(':','').lower() != expected:
                  sys.exit('FAIL: final APK ' + label + ' is not the registered Waffra release certificate')
              print('Final APK', label, 'matches Firebase registered release certificate')
          cfg=json.loads(pathlib.Path('firebase/google-services.json').read_text())
          android_clients = [
              o for client in cfg['client'] for o in client.get('oauth_client', [])
              if o.get('client_type') == 1 and
              o.get('android_info', {}).get('package_name') == 'com.waffra.app'
          ]
          if not any(o['android_info'].get('certificate_hash','').replace(':','').lower() == expected_sha1 for o in android_clients):
              print('NOTICE: checked-in google-services.json predates release SHA-1; refresh it from Firebase to ensure Google Sign-In client data is current')
          PY

      # AAB is a TEST candidate. Do NOT upload to a Production Play track
      # until the independent finance/security/physical-device gates pass.
      - name: Enforce Google Play Android 16 target SDK 36 for candidate AAB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'targetSdk = flutter.targetSdkVersion' in text:
              text = text.replace('targetSdk = flutter.targetSdkVersion',
                                  'targetSdk = 36', 1)
          if 'compileSdk = flutter.compileSdkVersion' in text:
              text = text.replace('compileSdk = flutter.compileSdkVersion',
                                  'compileSdk = 36', 1)
          if not re.search(r'\btargetSdk\s*=\s*36\b', text):
              raise SystemExit('FAIL: expected Android application targetSdk = 36')
          if not re.search(r'\bcompileSdk\s*=\s*36\b', text):
              raise SystemExit('FAIL: expected Android application compileSdk = 36')
          path.write_text(text)
          print('Candidate AAB SDK policy: targetSdk = 36; compileSdk = 36')
          PY

      - name: Build Android App Bundle candidate for Google Play internal testing
        shell: bash
        env:
          WAFFRA_RELEASE_STORE_PASSWORD: ${{ secrets.WAFFRA_RELEASE_STORE_PASSWORD }}
          WAFFRA_RELEASE_KEY_PASSWORD: ${{ secrets.WAFFRA_RELEASE_KEY_PASSWORD }}
          WAFFRA_PUBLIC_EIA_KEY: ${{ secrets.WAFFRA_PUBLIC_EIA_KEY }}
        run: |
          eia_define=()
          if [[ -n "${WAFFRA_PUBLIC_EIA_KEY:-}" ]]; then
            eia_define+=(--dart-define="WAFFRA_PUBLIC_EIA_KEY=${WAFFRA_PUBLIC_EIA_KEY}")
          fi
          flutter build appbundle --no-pub --release --target-platform android-arm64 --tree-shake-icons "${eia_define[@]}"
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Validate signed AAB archive (not a Play approval)
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          unzip -t "$bundle" > /dev/null
          jarsigner -verify "$bundle" > /dev/null
          sha256sum "$bundle" | tee aab_candidate_sha256.txt
          echo 'Signed candidate AAB built. Store policy and physical-install proof still required.'

      - name: Upload signed Google Play internal-testing AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: Waffra-Android-API36-AAB-Internal-Test-Candidate
          path: |
            build/app/outputs/bundle/release/app-release.aab
            aab_candidate_sha256.txt
          retention-days: 30

      # Only save compilation state after the signed APK was built, verified
      # and uploaded. Skip excessive cache sizes that hurt performance.
      - name: Measure Flutter compilation cache size
        id: flutter_cache_size
        shell: bash
        run: |
          if [ ! -d .dart_tool/flutter_build ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bytes=$(du -sb .dart_tool/flutter_build | cut -f1)
          echo "Flutter compilation intermediates: $bytes bytes"
          if [ "$bytes" -gt 0 ] && [ "$bytes" -le 524288000 ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Compilation cache upload skipped (empty or above 500 MiB).'
          fi

      - name: Save Flutter compilation intermediates
        if: steps.flutter_cache_size.outputs.eligible == 'true'
        uses: actions/cache/save@v4
        with:
          path: .dart_tool/flutter_build
          key: waffra-flutter-compile-v1-${{ runner.os }}-${{ steps.flutter_cache_identity.outputs.revision }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'native/**', 'firebase/google-services.json', '.github/workflows/android.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Results become reusable ONLY after tests, Android build, signature
      # verification and APK upload have ALL succeeded in this same job.
      - name: Save verified green test fingerprints
        uses: actions/cache/save@v4
        with:
          path: .ci_cache/waffra_green_tests.json
          key: waffra-smart-tests-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Fail closed if compiled APK differs from checkout, if another
      # commit was pushed while the build was running, or if APK is invalid.
      # Previous QA artifacts may still exist but are not current releases.
      - name: Gate QA APK on embedded SHA and current branch head
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          latest=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          test -n "$latest"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "::error::BLOCKED stale APK: branch moved to $latest from $SOURCE_SHA"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          p = pathlib.Path('build/app/outputs/flutter-apk/app-release.apk')
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit('BLOCKED: signed APK missing or empty')
          with zipfile.ZipFile(p) as z:
              identity_file = 'assets/waffra-build-identity.json'
              if identity_file not in z.namelist():
                  raise SystemExit('BLOCKED: APK missing compiled source identity')
              actual = json.loads(z.read(identity_file))
              if z.testzip() is not None:
                  raise SystemExit('BLOCKED: APK archive is corrupt')
          expected = {
              'commit_sha': os.environ['SOURCE_SHA'],
              'branch': os.environ['SOURCE_BRANCH'],
              'workflow_run': os.environ['SOURCE_RUN'],
              'build_type': 'qa-android-arm64',
          }
          if actual != expected:
              raise SystemExit('BLOCKED: packaged APK identity does not match checked-out source and workflow')
          print('PASS: compiled APK identity exactly matches source commit, branch and build run')
          PY
          echo "✅ Exact commit and packaged APK verified: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      # Attach a human-readable receipt to identify the exact verified
      # APK revision before installation. This is a QA artifact, not a
      # certification of SQLCipher production cutover or device tests.
      - name: Generate exact-commit APK checklist and SHA-256 receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib, os, pathlib
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          content = '\n'.join([
              'WAFFRA QA BUILD RECEIPT - VERIFY BEFORE INSTALL',
              'Source commit: ' + os.environ['SOURCE_SHA'],
              'Source branch: ' + os.environ['SOURCE_BRANCH'],
              'GitHub Actions run: ' + os.environ['SOURCE_RUN'],
              'APK sha256: ' + digest,
              'Proof: embedded Android asset commit, branch and run were verified.',
              'Proof: verified SHA was still current branch HEAD before publication.',
              'Build: signed ARM64 QA candidate; NOT Google Play release.',
              'Required before this APK is published: full Flutter/Python tests,',
              'same-commit independent workflow success and Android build checks.',
              'Approved UX fixes in this candidate source:',
              '- Attachment count in transaction corner, AR/EN directional.',
              '- Original SMS message displayed in transaction Notes when stored.',
              '- Fixed + button position across pages; slower tap-only animation.',
              '- New-install Light mode; saved appearance preferences preserved.',
              '- Revised six-step onboarding tour and recent prior main fixes.',
              'SECURITY: SQLCipher production cutover is NOT certified.',
              'Do NOT use real bank SMS or financial data in this test APK.',
              'Physical-device visual signoff and encrypted storage pending.',
              'Release policy: QA only until separate real-device/security signoff.',
              '',
          ])
          pathlib.Path('build/waffra-qa-build-receipt.txt').write_text(content, encoding='utf-8')
          print('APK receipt:', content)
          PY

      # Every APK includes human-readable, Arabic release notes generated
      # from the approved changes tracked in Git. Future app-code changes
      # require updating the approval manifest before an APK is published.
      - name: Generate and validate Waffra Release Notes TXT
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          NOTES_SOURCE=docs/release/WAFFRA_APPROVED_CHANGES.txt
          test -s "$NOTES_SOURCE" || { echo "::error::Missing approved release notes"; exit 1; }
          # Compare ancestry, not timestamps; prevent shipping app changes
          # that postdate the approved changelog, including future requests.
          notes_commit=$(git log -1 --format=%H -- "$NOTES_SOURCE")
          code_commit=$(git log -1 --format=%H -- lib/main.dart lib/waffra_widget_capture.part.dart lib/storage android/app/src/main)
          test -n "$notes_commit"
          test -n "$code_commit"
          if ! git merge-base --is-ancestor "$code_commit" "$notes_commit"; then
            echo "::error::Approved release notes are older than app-code changes. Update $NOTES_SOURCE before publishing APK."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, os, pathlib
          approved = pathlib.Path('docs/release/WAFFRA_APPROVED_CHANGES.txt')
          source = approved.read_text(encoding='utf-8')
          required = ['شارة المرفقات', 'الملاحظات', 'زر الإضافة', 'الوضع الفاتح']
          for label in required:
              if label not in source:
                  raise SystemExit('BLOCKED: approved release notes missing required category: ' + label)
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-release.apk')
          receipt = pathlib.Path('build/waffra-qa-build-receipt.txt')
          if not apk.is_file() or not apk.stat().st_size or not receipt.is_file():
              raise SystemExit('BLOCKED: APK or its verification receipt is missing')
          apk_digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          saved_receipt = receipt.read_text(encoding='utf-8')
          if 'APK sha256: ' + apk_digest not in saved_receipt:
              raise SystemExit('BLOCKED: published APK hash differs from QA receipt')
          sha = os.environ['SOURCE_SHA']
          if 'Source commit: ' + sha not in saved_receipt:
              raise SystemExit('BLOCKED: APK receipt points at another source revision')
          header = '\n'.join([
              'وفرة - Waffra | Release Notes',
              '==============================================',
              'حالة النسخة: APK تجريبي اجتاز بوابات اختبارات CI الخاصة بهذا التشغيل.',
              'ملاحظة: النجاح الآلي لا يثبت نجاح التجربة على هاتف فعلي.',
              '',
              'رقم تشغيل GitHub Actions: ' + os.environ['SOURCE_RUN'],
              'المستودع: ' + os.environ['SOURCE_REPO'],
              'الفرع: ' + os.environ['SOURCE_BRANCH'],
              'Commit SHA: ' + sha,
              'APK SHA-256: ' + apk_digest,
              'Approved changes SHA-256: ' + hashlib.sha256(approved.read_bytes()).hexdigest(),
              'رابط التشغيل: https://github.com/' + os.environ['SOURCE_REPO'] + '/actions/runs/' + os.environ['SOURCE_RUN'],
              '',
              '============ RELEASE NOTES / التعديلات ============',
              '',
          ])
          footer = '\n'.join([
              '',
              '============ STATUS / حالة الاعتماد ============',
              'اجتياز بوابات هذا البيلد: مطلوب لإرفاق هذا الملف مع APK.',
              'الاختبار البصري على هاتف فعلي: غير مثبت بواسطة CI.',
              'التخزين المشفر SQLCipher في الإنتاج: لم يتم اعتماده.',
              'حفظ رسائل بنكية حقيقية قبل تفعيل التشفير: غير مسموح.',
              'التثبيت المقصود: QA ببيانات تجريبية فقط.',
              'لا تعتبر أي نسخة حالية إذا لم يطابق الـCommit وبصمة APK هذا الملف.',
              '',
          ])
          output = pathlib.Path('build/Waffra-Release-Notes.txt')
          output.write_text(header + source.rstrip() + '\n' + footer, encoding='utf-8-sig')
          if output.stat().st_size < 500:
              raise SystemExit('BLOCKED: Release Notes TXT unexpectedly short')
          print('PASS: approved release notes packaged for exact commit ' + sha)
          print('PASS: release notes match APK sha256 ' + apk_digest)
          PY
          test -s build/Waffra-Release-Notes.txt
          echo "✅ Waffra-Release-Notes.txt (same verified commit and APK hash)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage verified Waffra.apk for download
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 build/app/outputs/flutter-apk/app-release.apk build/Waffra.apk
          cmp -s build/app/outputs/flutter-apk/app-release.apk build/Waffra.apk

      # Only the LAST step publishes the APK and its exact source receipt.
      - name: Publish signed QA APK (FINAL step)
        uses: actions/upload-artifact@v4
        with:
          name: Waffra-Android-ARM64-Release-${{ github.sha }}
          path: |
            build/Waffra.apk
            build/waffra-qa-build-receipt.txt
            build/Waffra-Release-Notes.txt
          if-no-files-found: error
          retention-days: 30
