name: Build Waffra Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=waffra .

      - name: Configure Android biometric authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android')
          manifest = android / 'app/src/main/AndroidManifest.xml'
          if not manifest.exists():
              raise SystemExit('Missing generated AndroidManifest.xml')
          xml = manifest.read_text()
          for permission in ('USE_BIOMETRIC', 'USE_FINGERPRINT'):
              entry = f'<uses-permission android:name="android.permission.{permission}" />'
              if entry not in xml:
                  xml = xml.replace('<application', '    ' + entry + '\n    <application', 1)
          manifest.write_text(xml)

          kotlin = list((android / 'app/src/main/kotlin').rglob('MainActivity.kt'))
          java = list((android / 'app/src/main/java').rglob('MainActivity.java'))
          if kotlin:
              activity = kotlin[0]
              source = activity.read_text()
              source = source.replace('import io.flutter.embedding.android.FlutterActivity',
                                      'import io.flutter.embedding.android.FlutterFragmentActivity')
              source = source.replace('FlutterActivity()', 'FlutterFragmentActivity()')
              if 'FLAG_SECURE' not in source:
                  source = source.replace('import io.flutter.embedding.android.FlutterFragmentActivity',
                      'import android.os.Bundle\nimport android.view.WindowManager\nimport io.flutter.embedding.android.FlutterFragmentActivity')
                  source = source.replace('FlutterFragmentActivity() {',
                      'FlutterFragmentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)\n    }')
                  if 'FLAG_SECURE' not in source:
                      raise SystemExit('Could not add screenshot protection to Kotlin MainActivity')

              if 'FlutterFragmentActivity' not in source:
                  raise SystemExit('Could not patch MainActivity.kt')
              activity.write_text(source)
              print('Configured', activity)
          elif java:
              activity = java[0]
              source = activity.read_text()
              source = source.replace('import io.flutter.embedding.android.FlutterActivity;',
                                      'import io.flutter.embedding.android.FlutterFragmentActivity;')
              source = source.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              if 'FLAG_SECURE' not in source:
                  source = source.replace('import io.flutter.embedding.android.FlutterFragmentActivity;',
                      'import android.os.Bundle;\nimport android.view.WindowManager;\nimport io.flutter.embedding.android.FlutterFragmentActivity;')
                  source = source.replace('extends FlutterFragmentActivity {',
                      'extends FlutterFragmentActivity {\n    @Override public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);\n    }')
                  if 'FLAG_SECURE' not in source:
                      raise SystemExit('Could not add screenshot protection to Java MainActivity')

              if 'FlutterFragmentActivity' not in source:
                  raise SystemExit('Could not patch MainActivity.java')
              activity.write_text(source)
              print('Configured', activity)
          else:
              raise SystemExit('Could not find MainActivity')

          # local_auth requires an AppCompat-based theme for older Android versions.
          for styles in android.glob('app/src/main/res/values*/styles.xml'):
              content = styles.read_text()
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              styles.write_text(content)
              print('Configured', styles)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Waffra app icon
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Waffra APK
        uses: actions/upload-artifact@v4
        with:
          name: Waffra-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
