# Waffra ARM64 release rebuild requested 2026-10-18 18:20 UTC
# Re-trigger optimized ARM64 build; preserve Tajawal typography
name: Build Waffra Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=waffra .

      - name: Configure Android biometric authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android')
          manifest = android / 'app/src/main/AndroidManifest.xml'
          if not manifest.exists():
              raise SystemExit('Missing generated AndroidManifest.xml')
          xml = manifest.read_text()
          for permission in ('USE_BIOMETRIC', 'USE_FINGERPRINT'):
              entry = f'<uses-permission android:name="android.permission.{permission}" />'
              if entry not in xml:
                  xml = xml.replace('<application', '    ' + entry + '\n    <application', 1)
          manifest.write_text(xml)

          kotlin = list((android / 'app/src/main/kotlin').rglob('MainActivity.kt'))
          java = list((android / 'app/src/main/java').rglob('MainActivity.java'))
          if kotlin:
              activity = kotlin[0]
              original = activity.read_text()
              import re
              package_match = re.search(r'^\s*package\s+([\w.]+)', original, re.MULTILINE)
              if not package_match:
                  raise SystemExit('Cannot determine Kotlin MainActivity package')
              package_name = package_match.group(1)
              source = (
                  f'package {package_name}\n\n'
                  'import android.os.Bundle\n'
                  'import android.view.WindowManager\n'
                  'import io.flutter.embedding.android.FlutterFragmentActivity\n'
                  'import io.flutter.embedding.engine.FlutterEngine\n'
                  'import io.flutter.plugin.common.MethodChannel\n\n'
                  'class MainActivity : FlutterFragmentActivity() {\n'
                  '    private val privacyChannel = "waffra/privacy"\n'
                  '    private fun applyScreenshotSetting(allowed: Boolean) {\n'
                  '        if (allowed) window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '        else window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n'
                  '    }\n'
                  '    override fun onCreate(savedInstanceState: Bundle?) {\n'
                  '        super.onCreate(savedInstanceState)\n'
                  '        val prefs = getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)\n'
                  '        applyScreenshotSetting(prefs.getBoolean("flutter.waffra_allow_screenshots", true))\n'
                  '    }\n'
                  '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n'
                  '        super.configureFlutterEngine(flutterEngine)\n'
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, privacyChannel)\n'
                  '            .setMethodCallHandler { call, result ->\n'
                  '                if (call.method == "setScreenshotsAllowed") {\n'
                  '                    val allowed = call.arguments as? Boolean ?: false\n'
                  '                    applyScreenshotSetting(allowed)\n'
                  '                    result.success(null)\n'
                  '                } else result.notImplemented()\n'
                  '            }\n'
                  '    }\n'
                  '}\n'
              )
              activity.write_text(source)
              assert 'FLAG_SECURE' in activity.read_text()
              print('Configured secure Kotlin activity:', activity)
          elif java:
              activity = java[0]
              source = activity.read_text()
              source = source.replace('import io.flutter.embedding.android.FlutterActivity;',
                                      'import android.os.Bundle;\\nimport android.view.WindowManager;\\nimport io.flutter.embedding.android.FlutterFragmentActivity;')
              source = source.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              source = source.replace('extends FlutterFragmentActivity {',
                  'extends FlutterFragmentActivity {\\n'
                  '    @Override public void onCreate(Bundle savedInstanceState) {\\n'
                  '        super.onCreate(savedInstanceState);\\n'
                  '        getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);\\n'
                  '    }')
              if 'FLAG_SECURE' not in source:
                  raise SystemExit('Could not secure Java MainActivity')
              activity.write_text(source)
              print('Configured secure Java activity:', activity)
          else:
              raise SystemExit('Could not find MainActivity')

          # local_auth requires an AppCompat-based theme for older Android versions.
          for styles in android.glob('app/src/main/res/values*/styles.xml'):
              content = styles.read_text()
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              content = content.replace(
                  '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">',
                  '<style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">')
              styles.write_text(content)
              print('Configured', styles)
          PY

      - name: Preserve SharedPreferences Android plugin in Release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('android/app')
          kt = app / 'build.gradle.kts'
          groovy = app / 'build.gradle'
          if kt.exists():
              path = kt
              source = path.read_text()
              needle = 'buildTypes {'
              if needle not in source:
                  raise SystemExit('Cannot find Android Kotlin buildTypes')
              source = source.replace(needle, needle + '''
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              ''', 1)
          elif groovy.exists():
              path = groovy
              source = path.read_text()
              needle = 'buildTypes {'
              if needle not in source:
                  raise SystemExit('Cannot find Android Groovy buildTypes')
              source = source.replace(needle, needle + '''
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              ''', 1)
          else:
              raise SystemExit('Cannot find Android app Gradle build file')
          path.write_text(source)
          print('Disabled R8 shrinking and obfuscation for Release:', path)
          print('Keeping ARM64 and Flutter Dart tree shaking enabled')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Remove Flutter-generated sample test and stale lint include
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sample = Path('test/widget_test.dart')
          if sample.exists() and 'MyApp' in sample.read_text():
              sample.unlink()
              print('Removed Flutter create default MyApp sample test')
          options = Path('analysis_options.yaml')
          if options.exists():
              data = options.read_text()
              data = data.replace('include: package:flutter_lints/flutter.yaml', '')
              options.write_text(data)
              print('Removed unresolved generated flutter_lints include')
          PY

      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run all Flutter tests
        run: flutter test

      - name: Generate Waffra app icon
        run: dart run flutter_launcher_icons

      # The hosted Android emulator uses x86_64. Build an x64 Release APK for
      # the smoke test; upload only the final ARM64 APK for the user.
      - name: Build x64 Release APK for emulator smoke test
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --target-platform android-x64 --tree-shake-icons

      - name: Verify Release startup on Android emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            PACKAGE=$(adb shell pm list packages -3 | tr -d '\r' | sed -n 's/^package://p' | grep -m1 -E 'waffra' || true)
            test -n "$PACKAGE" || { echo "Could not find installed Waffra package"; exit 1; }
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof "$PACKAGE" || { adb logcat -d -t 350; exit 1; }
            adb shell uiautomator dump /sdcard/waffra-ui.xml || true
            adb pull /sdcard/waffra-ui.xml /tmp/waffra-ui.xml || true
            if [ -f /tmp/waffra-ui.xml ]; then
              if grep -qE 'تعذر تشغيل وفرة|نسخ تفاصيل الخطأ|Retry' /tmp/waffra-ui.xml; then
                echo "Startup error UI detected"
                adb logcat -d -t 350
                exit 1
              fi
            fi
            if adb logcat -d -t 2000 | grep -E 'NoSuchMethodError.*SharedPreferences|FATAL EXCEPTION|Waffra startup failed:'; then
              echo "Release startup error detected in Android logs"
              exit 1
            fi
            echo "Release app launched without detected startup exception"

      - name: Build optimized ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --tree-shake-icons

      - name: Measure release APK size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/app/outputs/flutter-apk/app-release.apk')
          print(f'WAFFRA_ARM64_RELEASE_APK_MIB={p.stat().st_size / 1048576:.2f}')
          PY

      - name: Upload Waffra Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Waffra-Android-ARM64-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
