name: M158 Widget SMS Title Privacy

on:
  push:
    branches:
      - 'integration/m158-widget-sms-title-privacy-20261023'
  pull_request:
    paths:
      - 'native/WaffraWidget.kt'
      - 'lib/waffra_home_widget.dart'
      - 'lib/waffra_merchant_rules.dart'
      - 'test/waffra_merchant_rules_test.dart'
      - '.github/workflows/m158-widget-sms-title-privacy.yml'
  workflow_dispatch:

concurrency:
  group: waffra-pr-m158-widget-sms-title-privacy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  widget-sms-private-title:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prefetch SHA256-verified official SQLite3MC native release assets
        uses: ./.github/actions/prefetch-sqlite3mc
        with:
          github-token: ${{ github.token }}
      - run: flutter pub get
      - name: Analyze shared merchant parser and Widget code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/waffra_merchant_rules.dart lib/waffra_home_widget.dart test/waffra_merchant_rules_test.dart
      - name: Check merchant privacy and finance regression
        run: flutter test test/waffra_merchant_rules_test.dart test/m155_category_plan_finance_parity_test.dart test/storage/m156_atomic_merchant_category_sms_commit_test.dart
      - name: Reject raw bank SMS in Widget ledger titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          widget=Path('native/WaffraWidget.kt').read_text()
          import sys
          sys.path.insert(0, str(Path('test/qa').resolve()))
          from waffra_home_source import read_waffra_home_source
          home=read_waffra_home_source()
          bridge=Path('lib/waffra_home_widget.dart').read_text()
          rules=Path('lib/waffra_merchant_rules.dart').read_text()
          assert not Path('lib/waffra_widget_capture.part.dart').exists()
          assert 'Intent(context, MainActivity::class.java)' in widget
          assert 'action = "waffra.ADD_TRANSACTION"' in widget
          assert 'PendingIntent.FLAG_IMMUTABLE' in widget
          assert 'entry.raw.replaceAll' not in widget
          assert 'waffraWidgetAction' in bridge
          assert "if(!mounted||!ready||waffraWidgetAction.value!='add')return;" in home
          assert 'WaffraAutoSms.acknowledgeCommitted([id])' in home
          assert 'final title=' in rules and 'final merchant=waffraMerchantName' in rules
          print('Widget only routes to owner-verified manual entry; merchant SMS privacy/dedupe retained.')
          PY
