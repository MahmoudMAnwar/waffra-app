name: Waffra Android Finance Migration Rehearsal (Historical / Manual)

# The emulator exercise is expensive and originally applied to M60/M160 only.
# Isolate it to the original source branches; general PRs keep the complete
# finance test suite but no longer show a skipped Android rehearsal job.
on:
  push:
    branches:
      - 'feature/storage-cutover-readiness-m60'
      - 'integration/m160-reconcile-main-m158-release-gate-20261023'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-finance-migration-rehearsal:
    name: Android isolated finance and receipt migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Android finance rehearsal revision
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android test harness
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Configure Java core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          gradle=path.read_text()
          if 'compileOptions {' not in gradle:
              raise SystemExit('Missing Kotlin Android compileOptions')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle:
              gradle=gradle.replace('compileOptions {',
                'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          declaration='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if declaration not in gradle:
              gradle+='\n// Required by flutter_local_notifications\ndependencies {\n    '+declaration+'\n}\n'
          path.write_text(gradle)
          PY
      - name: Resolve packages and SQLCipher native assets
        run: flutter pub get
      - name: Preserve full regression prerequisite on the same source revision
        # Formerly provided by a dependency on the full offline Flutter job.
        # Never run the emulator without checking all Flutter app/storage tests.
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test test/ --reporter expanded
      - name: Analyze isolated Android migration test
        run: dart analyze integration_test/live_finance_migration_receipts_android_test.dart
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rehearse legacy to SQLCipher with receipts on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: flutter test integration_test/live_finance_migration_receipts_android_test.dart -d emulator-5554 --reporter expanded
      - name: Confirm production cutover remains disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main.dart').read_text()
          bridge=Path('lib/storage/waffra_home_finance_persistence.dart').read_text()
          assert 'WaffraHomeFinancePersistence' in main
          assert 'loadWithWitness' in bridge
          assert 'saveLegacy' in bridge
          assert 'SQLCipher source activation is NOT implemented' in bridge
          print('PASS: synthetic encrypted migration tested, no production finance activation.')
          PY
