name: M248 Verified SQLCipher Manual Save Consent (NO APK)

on:
  pull_request:
    branches:
      - feature/m247-production-route-readiness-20261026
    paths:
      - 'lib/main.dart'
      - 'lib/storage/waffra_verified_finance_authority.dart'
      - 'test/storage/m181_encrypted_catalog_atomic_install_test.dart'
      - 'test/storage/m175_live_finance_mutation_intent_test.dart'
      - '.github/workflows/m248-verified-manual-save-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-consent-and-durable-sql:
    name: Real disposable SQLCipher manual append, consent, CAS and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m181_encrypted_catalog_atomic_install_test.dart
          test/storage/m175_live_finance_mutation_intent_test.dart
          --reporter expanded

  all-flutter-regression:
    name: Full Flutter test suite — same M248 candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded
