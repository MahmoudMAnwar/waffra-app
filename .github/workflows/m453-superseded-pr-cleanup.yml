name: M453 Safe Superseded PR Run Cleanup

# Trusted default-branch workflow; never checks out or executes PR source.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional open PR number; blank = recently updated open PRs'
        required: false
        type: string
      dry_run:
        description: 'Preview without cancellation (manual default)'
        type: boolean
        required: true
        default: true

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: m453-sweep-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  cancel-superseded-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cancel only superseded runs of active PRs in this repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const event = context.eventName;
            const inputs = context.payload.inputs || {};
            const dryRun = event === 'workflow_dispatch' && inputs.dry_run !== 'false';
            const targetNumber = event === 'pull_request_target'
              ? context.payload.pull_request?.number
              : (event === 'workflow_dispatch' && inputs.pr_number
                ? Number(inputs.pr_number) : null);
            let prs = [];
            if (targetNumber != null) {
              if (!Number.isSafeInteger(targetNumber) || targetNumber < 1) {
                throw new Error('Invalid PR number');
              }
              const response = await github.rest.pulls.get({
                owner, repo, pull_number: targetNumber,
              });
              prs = [response.data];
            } else {
              const response = await github.rest.pulls.list({
                owner, repo, state: 'open', sort: 'updated',
                direction: 'desc', per_page: 12,
              });
              prs = response.data;
            }
            let attempted = 0, previewed = 0, scanned = 0, settled = 0;
            let unresolved = 0, hardErrors = 0;
            const seenRuns = new Set();
            const active = new Set([
              'queued', 'in_progress', 'pending', 'waiting', 'requested'
            ]);
            const retryable = new Set([429, 500, 502, 503, 504]);
            const maxAttempts = 3;
            const maxPerSweep = 120;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (const pr of prs) {
              if (pr.state !== 'open' || pr.base?.ref !== 'main' ||
                  pr.head?.repo?.full_name !== repository) {
                core.info('Skip fork/closed/non-main PR #' + pr.number);
                continue;
              }
              const latest = pr.head.sha;
              const branch = pr.head.ref;
              const cutoff = Date.parse(pr.updated_at);
              if (!Number.isFinite(cutoff)) continue;
              // First collect candidates; cancelling during pagination shifts the list
              // and used to submit duplicate requests against the same run id.
              const candidateRuns = [];
              for (let page = 1; page <= 10; page++) {
                const refreshed = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });
                if (refreshed.data.state !== 'open' ||
                    refreshed.data.head.sha !== latest) {
                  core.info('PR head moved; stop scanning PR #' + pr.number);
                  break;
                }
                const response = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, branch, event: 'pull_request',
                  per_page: 100, page,
                });
                const runs = response.data.workflow_runs || [];
                for (const run of runs) {
                  if (seenRuns.has(run.id)) continue;
                  seenRuns.add(run.id);
                  scanned++;
                  if (!active.has(run.status) ||
                      !run.created_at ||
                      Date.parse(run.created_at) >= cutoff ||
                      run.head_sha === latest ||
                      run.head_branch !== branch ||
                      run.event !== 'pull_request' ||
                      run.id === context.runId ||
                      !(run.pull_requests || []).some(
                        linked => linked.number === pr.number)) {
                    continue;
                  }
                  candidateRuns.push(run);
                }
                if (runs.length < 100 || candidateRuns.length >= maxPerSweep) break;
              }
              for (const run of candidateRuns.slice(0, maxPerSweep)) {
                // The head is rechecked for EACH action, not just for list pagination.
                // Never cancel the new head, another owner's PR or main workflow.
                const refreshed = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });
                if (refreshed.data.state !== 'open' ||
                    refreshed.data.head.sha !== latest) {
                  core.info('PR head moved; stop cancellations for #' + pr.number);
                  break;
                }
                if (dryRun) {
                  previewed++;
                  core.info('DRY RUN PR #' + pr.number +
                    ': stale run ' + run.id + ' SHA ' + run.head_sha);
                  continue;
                }
                let resolved = false;
                let transientFailure = null;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner, repo, run_id: run.id,
                    });
                    attempted++;
                    resolved = true;
                    core.info('Cancelled old PR #' + pr.number +
                      ' run ' + run.id);
                    break;
                  } catch (err) {
                    if (err.status === 409) {
                      // Already completed or cancellation raced another cleaner.
                      settled++;
                      resolved = true;
                      break;
                    }
                    // GitHub can return 500 after actually accepting a cancel.
                    // Re-read the run before retrying to avoid duplicate cancel storms.
                    try {
                      const observed = await github.rest.actions.getWorkflowRun({
                        owner, repo, run_id: run.id,
                      });
                      if (!active.has(observed.data.status)) {
                        settled++;
                        resolved = true;
                        break;
                      }
                      if (observed.data.head_sha !== run.head_sha ||
                          observed.data.head_branch !== branch ||
                          observed.data.event !== 'pull_request') {
                        hardErrors++;
                        core.error('Unexpected run identity for ' + run.id);
                        resolved = true;
                        break;
                      }
                    } catch (statusError) {
                      if (statusError.status === 404) {
                        settled++;
                        resolved = true;
                        break;
                      }
                      if (statusError.status === 401 || statusError.status === 403) {
                        hardErrors++;
                        core.error('Cannot verify run ' + run.id +
                          ': ' + String(statusError.message).slice(0, 150));
                        resolved = true;
                        break;
                      }
                      // Transient inspection errors use the same bounded retry budget.
                    }
                    if (resolved) break;
                    if (!retryable.has(err.status)) {
                      hardErrors++;
                      core.error('Permanent cancellation error for ' + run.id +
                        ': ' + String(err.message).slice(0, 150));
                      resolved = true;
                      break;
                    }
                    transientFailure = err;
                    if (attempt + 1 < maxAttempts) {
                      // An owner can push while GitHub is experiencing a 5xx.
                      const headNow = await github.rest.pulls.get({
                        owner, repo, pull_number: pr.number,
                      });
                      if (headNow.data.state !== 'open' ||
                          headNow.data.head.sha !== latest) {
                        resolved = true;
                        core.info('PR head moved; do not retry ' + run.id);
                        break;
                      }
                      await sleep(250 * (2 ** attempt));
                    }
                  }
                }
                if (!resolved) {
                  unresolved++;
                  core.warning('PARTIAL CLEANUP: GitHub API could not cancel stale run ' +
                    run.id + ' after ' + maxAttempts + ' attempts: ' +
                    String(transientFailure?.message).slice(0, 150));
                  // Stop promptly during broad GitHub outages instead of flooding API.
                  if (unresolved >= 8) break;
                }
                if (attempted >= maxPerSweep) break;
              }
              if (attempted >= maxPerSweep || unresolved >= 8) break;
            }
            await core.summary
              .addHeading('M453 superseded-run cleanup')
              .addRaw('PRs checked: ' + prs.length +
                '; runs scanned: ' + scanned +
                '; accepted cancels: ' + attempted +
                '; already settled: ' + settled +
                '; dry-run matches: ' + previewed +
                '; transient unresolved: ' + unresolved +
                '; permanent errors: ' + hardErrors +
                '; mode: ' + (dryRun ? 'DRY RUN' : 'ACTIVE') +
                (unresolved ? '; result: PARTIAL (GitHub API unavailable)' :
                  '; result: complete'))
              .write();
            if (unresolved) {
              core.warning('M453 cleanup incomplete due to GitHub transient API errors; ' +
                unresolved + ' stale runs still require a later sweep.');
            }
            if (hardErrors) core.setFailed(hardErrors + ' permanent cleanup errors.');
