name: M370 Mandatory SQLCipher Fresh Install Policy (No Cutover)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m370-sqlcipher-stage-ci.yml'
      - 'lib/storage/waffra_mandatory_encrypted_first_run_gate.dart'
      - 'test/storage/m370_mandatory_encrypted_first_run_gate_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-sqlcipher-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed finance files
        run: dart analyze lib/storage/waffra_mandatory_encrypted_first_run_gate.dart test/storage/m370_mandatory_encrypted_first_run_gate_test.dart
      - name: Check stage-specific regression
        run: flutter test --reporter expanded test/storage/m370_mandatory_encrypted_first_run_gate_test.dart test/storage/fresh_encrypted_vault_bootstrap_test.dart
      - name: Confirm production cutover still requires independent evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('lib/storage/waffra_production_cutover_release_gate.dart').read_text()
          assert 'bool get automaticallyActivateSqlCipher => false;' in code
          print('No automatic SQLCipher production activation.')
          PY
