name: Trigger Waffra Gradle cache comparison

on:
  workflow_run:
    workflows:
      - Build Waffra Android APK
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  run-comparison:
    # Exactly one follow-up: only when the original #492 run succeeds.
    if: ${{ github.event.workflow_run.id == 39526226984 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start next Android workflow on the same main revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: "52339f36d28fea394d1213603f9bcd9908b6ba4f"
        shell: bash
        run: |
          set -euo pipefail
          # Only the comparison workflow itself may have changed since #492.
          # Other code changes would make the timing comparison invalid.
          CHANGED="$(gh api "repos/$REPOSITORY/compare/$EXPECTED_SHA...main" --jq '.files[].filename')"
          if [ "$CHANGED" != ".github/workflows/gradle-cache-comparison.yml" ]; then
            echo "::warning::App code changed since #492; refusing to benchmark different source code."
            exit 0
          fi
          gh api -X POST "repos/$REPOSITORY/actions/workflows/android.yml/dispatches" \
            -f ref=main -F run_smoke=false
          echo "Started comparison run with identical source revision."
