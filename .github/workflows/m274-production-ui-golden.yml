name: M274 Production UI Journeys and Golden Screenshot Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/m274_responsive_ui_journeys_test.dart'
      - 'integration_test/m274_ui_tap_smoke_android_test.dart'
      - '.github/scripts/run-m274-android-tap-smoke.sh'
      - 'tool/goldens/**'
      - 'scripts/qa/m274_verify_golden_candidates.py'
      - '.github/workflows/m274-production-ui-golden.yml'
      - 'lib/main.dart'
      - 'lib/waffra_footer.dart'
      - 'lib/waffra_balance_art.dart'
      # M534: M449 requires release-notes-last; certify the final exact PR SHA.
      - 'docs/release/WAFFRA_APPROVED_CHANGES.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m274-ui-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  m412-impact:
    name: M412 Impact Telemetry (M274 always verifies real Android UI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # M533: GitHub evaluates this M274 workflow against the cumulative PR
      # diff, but M412's incremental classifier checks just the last commit.
      # A docs-only release note must never turn skipped device jobs green.
      # Keep diagnostic impact telemetry, but *always* execute the real jobs
      # on every triggered M274 workflow. Failure of this prerequisite remains
      # a hard failure and dependent jobs are not claimed as passed.
      run: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Compare exact before/after change set (missing evidence means RUN)
        id: impact
        run: python3 scripts/qa/m412_pr_changed_impact.py --workflow .github/workflows/m274-production-ui-golden.yml

  widget-ui-and-golden-candidates:
    needs: m412-impact
    if: ${{ needs.m412-impact.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore dependencies
        run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py
      - name: Analyze responsive and pixel snapshot suites
        run: dart analyze test/m274_responsive_ui_journeys_test.dart tool/goldens/m274_capture_test.dart integration_test/m274_ui_tap_smoke_android_test.dart
      - name: Tap through five tabs, account-safe balance hide and inline errors
        run: flutter test --reporter expanded test/m274_responsive_ui_journeys_test.dart
      - name: Generate review candidates or strictly compare approved golden baselines
        shell: bash
        run: |
          set -euo pipefail
          if test -f tool/goldens/baselines/m274-footer-ar-light.png; then
            echo "APPROVED BASELINES PRESENT: pixel differences now fail CI."
            flutter test --reporter expanded tool/goldens/m274_capture_test.dart
          else
            echo "FIRST RUN: generate candidates only; not design-approved."
            flutter test --reporter expanded --update-goldens tool/goldens/m274_capture_test.dart
          fi
      - name: Verify PNG signatures, dimensions and record exact SHA-256s
        run: python3 scripts/qa/m274_verify_golden_candidates.py
      - name: Upload six visual candidates plus fingerprint receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m274-ui-golden-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tool/goldens/baselines/*.png
            build/m274-golden-candidate-receipt.json
          if-no-files-found: warn

  android-emulator-ui-taps:
    needs: m412-impact
    if: ${{ needs.m412-impact.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          python3 scripts/qa/m287_patch_tesseract_gradle.py
      - name: Generate temporary Android host for disposable UI test
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      # M543: Flutter upstream #192736: Impeller/GLES can terminate Linux
      # x86_64 software-emulator QEMU. Work around ONLY in the generated
      # disposable CI Android project. Never change the production manifest.
      - name: Apply test-only Linux emulator Impeller compatibility setting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          assert source.count('<application') == 1 and source.count('</application>') == 1
          assert 'io.flutter.embedding.android.EnableImpeller' not in source
          source = source.replace('</application>',
              '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" '
              'android:value="false" />\n    </application>', 1)
          manifest.write_text(source)
          assert 'android:value="false"' in manifest.read_text()
          print('M543_CI_ONLY_IMPELLER_DISABLED:real_android_engine_skia')
          PY
      - name: Configure Java library desugaring for Android UI emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('android/app/build.gradle.kts')
          if app.is_file():
              source = app.read_text()
              assert 'compileOptions {' in source
              if 'isCoreLibraryDesugaringEnabled = true' not in source:
                  source = source.replace('compileOptions {',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in source:
                  if 'dependencies {' in source:
                      source = source.replace('dependencies {',
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
                  else:
                      source += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              app.write_text(source)
          else:
              app = Path('android/app/build.gradle')
              assert app.is_file()
              source = app.read_text()
              assert 'compileOptions {' in source
              if 'coreLibraryDesugaringEnabled true' not in source:
                  source = source.replace('compileOptions {',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring ' not in source:
                  source += "\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\n"
              app.write_text(source)
          print('Desugaring enabled for disposable Android UI test host')
          PY
      - name: Syntax-check Android emulator test runner
        run: bash -n .github/scripts/run-m274-android-tap-smoke.sh
      # M387: precompile heavy Gradle/NDK workload BEFORE booting the emulator.
      # Keeping emulator and build tools active together exhausted CI resources.
      - name: Recover disposable Linux runner disk before Android emulator QA
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h .
      # M391: SDK repository occasionally sends a truncated NDK ZIP to
      # ephemeral hosted runners. Retry the *same* pinned SDK package, never
      # bypass or mark the real Android UI test green.
      - name: Install pinned Android NDK with bounded archive retries
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          version="28.2.13676358"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          installed=false
          for attempt in 1 2 3; do
            if test -f "$sdk/ndk/$version/source.properties"; then
              installed=true
              break
            fi
            echo "M391_NDK_DOWNLOAD_ATTEMPT:$attempt"
            rm -rf "$sdk/ndk/$version"
            if "$manager" --sdk_root="$sdk" "ndk;$version" && \
                test -f "$sdk/ndk/$version/source.properties"; then
              installed=true
              break
            fi
            sleep 5
          done
          if test "$installed" != true; then
            echo "::error::Pinned Android NDK archive unavailable or corrupt after 3 attempts"
            exit 1
          fi
          grep -q 'Pkg.Revision = 28.2.13676358' "$sdk/ndk/$version/source.properties"
      # M409: flutter drive can reuse the prebuilt APK; flutter test cannot.
      # Create the standard integration driver on this disposable CI checkout.
      - name: Prepare integration driver for prebuilt debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_driver
          cat > test_driver/integration_test.dart <<'DART'
          import 'package:integration_test/integration_test_driver.dart';
          Future<void> main() => integrationDriver();
          DART
      - name: Precompile Android UI integration APK before emulator launch
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --target integration_test/m274_ui_tap_smoke_android_test.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk
          # Avoid carrying a multi-GB idle Gradle daemon into the emulator.
          ./android/gradlew --stop
          df -h .
          free -h
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android-engine tap sequence on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # M535: dedicated Android Test Device image reduces unrelated GMS
          # service startup while preserving the same real API35 Flutter engine.
          target: aosp_atd
          arch: x86_64
          # M541: AOSP ATD emitted malformed Pixel 6 SystemUI overlay commands
          # immediately before the repeatable emulator disconnect. Use the
          # runner's smaller Pixel 2 hardware profile for the same real API35
          # Flutter UI assertions; no test skips or reduced Android API.
          profile: pixel_2
          cores: 4
          # M533 (#481): emulator 37.2.13 repeatedly terminated at the balance
          # eye test after footer succeeded. Freeze stable upstream 36.4.10
          # instead of floating sdkmanager's latest emulator release.
          # This is an official archived Linux emulator build, NOT a fake pass.
          emulator-build: 15004761
          # M386: cap AVD userdata instead of accepting Pixel default > available
          # GitHub runner disk. Keep the real Android UI tap test mandatory.
          disk-size: 3072M
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          emulator-boot-timeout: 600
          # M533: prefer dedicated stable SwiftShader GLES instead of auto
          # Lavapipe/Vulkan; never use deprecated swiftshader_indirect.
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader -feature -Vulkan -no-boot-anim
          # M543: no pre-emulator-launch-script; it returned exit 127 while
          # the real runner already verifies pinned SDK source.properties.
          script: bash .github/scripts/run-m274-android-tap-smoke.sh
      - name: Upload actual Android emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m274-android-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/m274/*.log
          if-no-files-found: warn
          retention-days: 7

  # M533: GitHub reports a workflow successful even when a conditional job
  # was skipped. A release gate must prove the ACTUAL emulator and golden
  # suites completed, not merely that the workflow had no failed jobs.
  m274-required-android-certification:
    name: M274 Mandatory Actual Android + Golden Completion Gate
    needs: [m412-impact, widget-ui-and-golden-candidates, android-emulator-ui-taps]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject any skipped, cancelled or failed required UI job
        shell: bash
        env:
          M274_IMPACT_RESULT: ${{ needs.m412-impact.result }}
          M274_GOLDEN_RESULT: ${{ needs.widget-ui-and-golden-candidates.result }}
          M274_ANDROID_RESULT: ${{ needs.android-emulator-ui-taps.result }}
        run: |
          set -euo pipefail
          echo "M533 certification: M412=$M274_IMPACT_RESULT golden=$M274_GOLDEN_RESULT android=$M274_ANDROID_RESULT"
          if [[ "$M274_IMPACT_RESULT" != "success" ||
                "$M274_GOLDEN_RESULT" != "success" ||
                "$M274_ANDROID_RESULT" != "success" ]]; then
            echo "::error::M274 cannot certify a skipped, cancelled or failed real Android UI or golden job"
            exit 1
          fi
          echo "M533_M274_REAL_JOBS_CONFIRMED:android_and_golden_success"
