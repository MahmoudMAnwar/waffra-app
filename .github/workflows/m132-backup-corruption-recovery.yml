name: M132 Backup Corruption Recovery QA

on:
  push:
    branches:
      - 'test/m132-backup-corruption-recovery-negative-qa'
  pull_request:
    branches:
      - 'test/m131-backup-boundary-and-tamper-qa'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m132-backup-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  negative-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run M130-M132 backup security and UI regressions
        run: flutter test test/waffra_secure_backup_test.dart test/m127_ui_tour_backup_acceptance_test.dart test/m131_backup_boundary_tamper_qa_test.dart test/m132_backup_corruption_recovery_negative_test.dart
