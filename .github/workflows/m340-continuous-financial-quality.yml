name: M340 Continuous Financial Quality Gate (Exact SHA, No Cutover)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Event driven, never scheduled. Outdated runs of this workflow are cancelled.
concurrency:
  group: m340-finance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: Finance, model and SQLCipher source control
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head, not synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify revision
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Read-only finance guard
        run: python3 scripts/qa/m340_financial_quality_gate.py --json
      - name: Prove guard rejects hostile finance changes
        run: python3 -m unittest discover -s test/qa -p 'test_m340_financial_quality_gate.py' -v
      - name: Device proof disclaimer
        run: echo "PASS is source-only; not a physical Android or production SQLCipher certification."

  critical-finance-tests:
    name: Manual, bank SMS, OCR, FX and Ask Waffra
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run critical finance acceptance cases
        run: |
          flutter test --reporter expanded \
            test/bank_sms_test.dart \
            test/waffra_validators_test.dart \
            test/m280_sms_fuzz_and_boundary_test.dart \
            test/m280_financial_integrity_fault_injection_test.dart \
            test/m287_receipt_ocr_test.dart \
            test/m291_multicurrency_bank_sms_review_test.dart \
            test/m292_sms_fx_review_test.dart \
            test/m297_ocr_to_finance_and_sms_layout_test.dart \
            test/m300_all_supported_currency_sms_matrix_test.dart \
            test/m302_cross_feature_input_precision_test.dart \
            test/m317_ai_finance_brain_test.dart \
            test/m332_ai_ocr_hang_and_six_for_three_test.dart \
            test/m332_live_bank_image_sms_hang_regression_test.dart \
            test/m333_ask_waffra_verified_answers_test.dart \
            test/m335_ask_waffra_scope_test.dart \
            test/m335_real_sms_ocr_accuracy_test.dart \
            test/m336_fx_consent_and_full_title_test.dart \
            test/m336_whole_app_finance_quality_matrix_test.dart \
            test/m337_bank_sms_timestamp_finance_safety_test.dart \
            test/m337_finance_durable_preflight_safety_test.dart \
            test/m337_sms_parser_duplicate_integrity_test.dart \
            test/m338_currency_less_sms_finance_guard_test.dart \
            test/m339_failed_finance_save_receipt_cleanup_test.dart

  full-app:
    name: Analyze and test complete Flutter application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze whole app; errors fail the job
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Execute every Flutter unit and widget test
        run: flutter test test/ --reporter expanded

  combined-verdict:
    name: M340 exact-SHA quality verdict (device proof excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [source-contract, critical-finance-tests, full-app]
    steps:
      - name: Block if any required quality job failed or did not run
        env:
          SOURCE: ${{ needs.source-contract.result }}
          FINANCE: ${{ needs.critical-finance-tests.result }}
          ALL_APP: ${{ needs.full-app.result }}
        run: |
          printf 'Exact SHA: %s\n' "$TESTED_SHA"
          printf 'Source=%s Finance=%s WholeApp=%s\n' "$SOURCE" "$FINANCE" "$ALL_APP"
          test "$SOURCE" = success
          test "$FINANCE" = success
          test "$ALL_APP" = success
          echo "PASS: verified code QA on one SHA. Physical Android and SQLCipher cutover still NOT certified."
