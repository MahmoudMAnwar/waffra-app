name: M246 Cumulative SQLCipher Same-Head QA (NO APK)

on:
  pull_request:
    branches:
      - feature/m235-authoritative-sqlcipher-backup-export-route-20261026
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/m246-sqlcipher-cumulative-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# All jobs checkout the identical candidate SHA, with no build/release jobs.
# CI success is NOT a two-physical-phone attestation or production cutover.
jobs:
  twenty-four-route-coverage:
    name: 24-route inventory and actual M236 Actions matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m236_remaining_20_route_matrix_test.dart
          test/storage/m241_actual_route_matrix_dispatch_test.dart
          --reporter expanded

  actual-disposable-sqlcipher-writers:
    name: Disposable SQLCipher writes, receipt bytes, CAS and backup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m235_verified_encrypted_backup_export_route_test.dart
          test/storage/m114_sqlcipher_projected_edit_test.dart
          --reporter expanded

  combined-user-journeys:
    name: Home invoice recycle, Widget SMS, restore/reset source refusal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter test
          test/storage/m187_active_restore_preflight_test.dart
          test/storage/m237_safe_restore_reset_route_ui_test.dart
          test/storage/m238_home_receipt_recycle_route_test.dart
          test/waffra_widget_verified_source_integrity_test.dart
          test/waffra_directional_fab_receipt_corner_test.dart
          test/waffra_oct21_regression_test.dart
          --reporter expanded

  full-flutter-regression:
    name: Full Flutter test suite on one cumulative head
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded

