  full-flutter-regression:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter with cached SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Run complete Flutter test suite, not only changed tests
        run: flutter test

  android-arm64-compilation:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Android project (CI only)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: M219 compile real native Keystore owner channel with Flutter
        if: github.head_ref == 'feature/m219-android-keystore-owner-proof-20261025'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if len(files)!=1:
              raise SystemExit('Expected single generated Kotlin MainActivity')
          original=files[0].read_text()
          match=re.search(r'^package\s+[\w.]+', original, re.MULTILINE)
          if not match:
              raise SystemExit('Missing generated MainActivity Kotlin package')
          template=Path('native/WaffraMainActivity.kt').read_text()
          if 'FirebaseAuth.getInstance().currentUser' not in template or 'waffra/account_owner' not in template:
              raise SystemExit('Missing M219 Android owner proof')
          # Match the generated QA app namespace so the test APK can launch.
          # The actual release workflow separately binds the signed package.
          template=re.sub(r'^package\s+[\w.]+', match.group(0),
                          template, count=1, flags=re.MULTILINE)
          files[0].write_text(template)
          # The isolated QA compilation checks the native owner channel.
          # Widget UI resources belong to the full signed build workflow;
          # this isolated stub prevents unrelated widget resources from
          # hiding native owner channel compiler errors.
          files[0].with_name('WaffraWidget.kt').write_text(
              match.group(0) + '\n' +
              'class WaffraWidget {\n' +
              '  companion object { fun updateAll(context: android.content.Context) {} }\n' +
              '}\n'
          )
          gradle=Path('android/app/build.gradle.kts')
          kotlin=gradle.read_text()
          if 'com.google.firebase:firebase-auth' not in kotlin:
              kotlin += '''
          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.0.0"))
              implementation("com.google.firebase:firebase-auth")
          }
          '''
              gradle.write_text(kotlin)
          PY
      - name: Compile ARM64 release-mode APK (not production certified)
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Attach unapproved-for-production APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: m147-arm64-ci-review-apk-not-production-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
