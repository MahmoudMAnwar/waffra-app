name: M147 Final Main-Safe Merge Readiness Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m147-main-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-exact-main-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head, not GitHub synthetic merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original M147 UI-only, SHA-pinned scope review
        if: github.head_ref != 'integration/m160-reconcile-main-m158-release-gate-20261023' && github.head_ref != 'qa/m174-main-sha-postmerge-20261024' && github.head_ref != 'feature/m175-explicit-finance-intent-routes' && github.head_ref != 'feature/m176-module-finance-route-intents' && github.head_ref != 'feature/m177-live-finance-authority-completion' && github.head_ref != 'feature/m178-restore-receipt-parity-preflight' && github.head_ref != 'feature/m179-encrypted-recurring-scalar-main' && github.head_ref != 'feature/m180-encrypted-custom-goal-suggestions-main' && github.head_ref != 'feature/m181-sqlcipher-route-coverage-main' && github.head_ref != 'feature/m182-encrypted-recurring-paid-main' && github.head_ref != 'feature/m183-verified-transaction-home-main' && github.head_ref != 'feature/m184-encrypted-recycle-expiry-main' && github.head_ref != 'feature/m185-encrypted-module-recycle-after-m184' && github.head_ref != 'feature/m186-verified-module-trash-after-m184' && github.head_ref != 'feature/m187-active-source-restore-after-m186' && github.head_ref != 'feature/m188-full-reset-after-m187' && github.head_ref != 'feature/m189-physical-evidence-after-m188' && github.head_ref != 'integration/sqlcipher-home-widget-binding-20261024' && github.head_ref != 'qa/m201-encrypted-route-migration-receipt-acceptance-20261024' && github.head_ref != 'fix/rtl-ltr-fab-receipt-corner-20261024' && github.head_ref != 'feature/m190-signed-apk-preflight-after-m201-ui-20261024' && github.head_ref != 'qa/m202-binder-after-m190-20261024' && github.head_ref != 'fix/m206-daylight-tour-sms-notes-motion-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/m147_main_merge_readiness_audit.py
      - name: M174 SHA-pinned additive QA-only scope review
        if: github.head_ref == 'qa/m174-main-sha-postmerge-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m174_main_scope_review.py
      - name: M175 exact intent route diff and permanent NO-GO review
        if: github.head_ref == 'feature/m175-explicit-finance-intent-routes'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m175_finance_intent_scope_review.py
      - name: M176 strict module finance route scope and NO-GO review
        if: github.head_ref == 'feature/m176-module-finance-route-intents'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m176_module_intent_scope_review.py
      - name: M177 exact SHA live authority scope and permanent NO-GO
        if: github.head_ref == 'feature/m177-live-finance-authority-completion'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m177_live_finance_authority_review.py
      - name: M178 exact SHA restore and receipt parity scope (NOT production)
        if: github.head_ref == 'feature/m178-restore-receipt-parity-preflight'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m178_restore_receipt_scope_review.py
      - name: M179 same-SHA source-aware encrypted recurring scalar scope (NO-GO)
        if: github.head_ref == 'feature/m179-encrypted-recurring-scalar-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m179_recurring_scalar_scope_review.py
      - name: M180 exact-SHA encrypted custom goals scope (release NO-GO)
        if: github.head_ref == 'feature/m180-encrypted-custom-goal-suggestions-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m180_encrypted_custom_goals_scope.py
      - name: M181 exact-SHA multi-route SQLCipher candidate scope, still NO-GO
        if: github.head_ref == 'feature/m181-sqlcipher-route-coverage-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m181_live_route_scope_review.py
      - name: M182 SHA-pinned encrypted recurring payment and no-go review
        if: github.head_ref == 'feature/m182-encrypted-recurring-paid-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m182_recurring_atomic_scope_review.py
      - name: M183 SHA-pinned SQLCipher transaction and receipt recycle NO-GO
        if: github.head_ref == 'feature/m183-verified-transaction-home-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m183_transaction_recycle_scope_review.py
      - name: M184 exact-SHA expired invoice recycle and two-clock guard (NO-GO)
        if: github.head_ref == 'feature/m184-encrypted-recycle-expiry-main'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m184_transaction_expiry_scope_review.py
      - name: M185 exact SHA SQLCipher category goal recurring trash (NO-GO)
        if: github.head_ref == 'feature/m185-encrypted-module-recycle-after-m184'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m185_module_recycle_scope_review.py
      - name: M186 SHA-pinned Home module trash authority and UI (NO-GO)
        if: github.head_ref == 'feature/m186-verified-module-trash-after-m184'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m186_module_home_route_review.py
      - name: M187 SHA-pinned isolated active restore candidate (NO-GO)
        if: github.head_ref == 'feature/m187-active-source-restore-after-m186'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m187_active_restore_scope_review.py
      - name: M188 exact-SHA encrypted reset after M187 review (NO-GO)
        if: github.head_ref == 'feature/m188-full-reset-after-m187'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m188_full_finance_reset_scope_review.py
      - name: M189 SHA-pinned two-physical-Android probe scope (still NO-GO)
        if: github.head_ref == 'feature/m189-physical-evidence-after-m188'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/qa/m189_physical_scope_review.py
          python3 scripts/qa/m189_physical_device_source_probe.py --check-contract
          python3 -m unittest discover -s test/qa -p 'm189_physical_device_source_probe_test.py'
      - name: SQLCipher Home/Widget existing-source binding, exact-SHA NO-GO review
        if: github.head_ref == 'integration/sqlcipher-home-widget-binding-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/sqlcipher_home_widget_binding_scope_review.py
      - name: M201 exact-SHA finance route, migration, receipt and hardware NO-GO review
        if: github.head_ref == 'qa/m201-encrypted-route-migration-receipt-acceptance-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m201_finance_acceptance_scope_review.py
      - name: Approved Arabic-left English-right FAB and receipt-corner exact-SHA review
        if: github.head_ref == 'fix/rtl-ltr-fab-receipt-corner-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/waffra_directional_fab_receipt_scope_review.py
      - name: M190 SHA-pinned independently signed APK preflight (still NO-GO)
        if: github.head_ref == 'feature/m190-signed-apk-preflight-after-m201-ui-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/qa/m190_signed_apk_scope_review.py
          python3 -m unittest discover -s test/qa -p 'm190_signed_apk_preflight_test.py'
      - name: M202 Android SQLCipher binder exact-SHA emulator-only NO-GO review
        if: github.head_ref == 'qa/m202-binder-after-m190-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m202_source_binder_scope_review.py
      - name: M206 exact-SHA 21-file bilingual SMS, PDF and UI strict scope (NO-GO)
        if: github.head_ref == 'fix/m206-daylight-tour-sms-notes-motion-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m206_ui_sms_scope_review.py
      - name: M161 guarded experimental integration review (not release approval)
        if: github.head_ref == 'integration/m160-reconcile-main-m158-release-gate-20261023'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/m161_main_reconciliation_review.py
      - name: Upload non-authorizing review report
        uses: actions/upload-artifact@v4
        with:
          name: m147-main-scope-review
          path: build/m147-final-review-report.json
          if-no-files-found: error

  full-flutter-regression:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter with cached SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Run complete Flutter test suite, not only changed tests
        run: flutter test

  android-arm64-compilation:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Android project (CI only)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Compile ARM64 release-mode APK (not production certified)
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Attach unapproved-for-production APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: m147-arm64-ci-review-apk-not-production-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
