name: M147 Final Main-Safe Merge Readiness Review

# Historical M147 audit was SHA-pinned to the pre-merge main baseline.
# M147 merged on 2026-10-23; running this audit on subsequent PRs
# incorrectly fails unrelated safe changes and skips their regression jobs.
# Preserve the historical manual audit without gating new PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m147-main-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-exact-main-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head, not GitHub synthetic merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run SHA-pinned, fail-closed read-only final review audit
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/m147_main_merge_readiness_audit.py
      - name: Upload non-authorizing review report
        uses: actions/upload-artifact@v4
        with:
          name: m147-main-scope-review
          path: build/m147-final-review-report.json
          if-no-files-found: error

  full-flutter-regression:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter with cached SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Run complete Flutter test suite, not only changed tests
        run: flutter test

  android-arm64-compilation:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Android project (CI only)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Compile ARM64 release-mode APK (not production certified)
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Attach unapproved-for-production APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: m147-arm64-ci-review-apk-not-production-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
