name: M147 Final Main-Safe Merge Readiness Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m147-main-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-exact-main-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head, not GitHub synthetic merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original M147 UI-only, SHA-pinned scope review
        if: github.head_ref != 'integration/m160-reconcile-main-m158-release-gate-20261023' && github.head_ref != 'qa/m174-main-sha-postmerge-20261024' && github.head_ref != 'feature/m175-explicit-finance-intent-routes' && github.head_ref != 'feature/m176-module-finance-route-intents' && github.head_ref != 'feature/m177-live-finance-authority-completion'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/m147_main_merge_readiness_audit.py
      - name: M174 SHA-pinned additive QA-only scope review
        if: github.head_ref == 'qa/m174-main-sha-postmerge-20261024'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m174_main_scope_review.py
      - name: M175 exact intent route diff and permanent NO-GO review
        if: github.head_ref == 'feature/m175-explicit-finance-intent-routes'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m175_finance_intent_scope_review.py
      - name: M176 strict module finance route scope and NO-GO review
        if: github.head_ref == 'feature/m176-module-finance-route-intents'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m176_module_intent_scope_review.py
      - name: M177 exact SHA live authority scope and permanent NO-GO
        if: github.head_ref == 'feature/m177-live-finance-authority-completion'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/qa/m177_live_finance_authority_review.py
      - name: M161 guarded experimental integration review (not release approval)
        if: github.head_ref == 'integration/m160-reconcile-main-m158-release-gate-20261023'
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/m161_main_reconciliation_review.py
      - name: Upload non-authorizing review report
        uses: actions/upload-artifact@v4
        with:
          name: m147-main-scope-review
          path: build/m147-final-review-report.json
          if-no-files-found: error

  full-flutter-regression:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Flutter with cached SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Run complete Flutter test suite, not only changed tests
        run: flutter test

  android-arm64-compilation:
    needs: review-exact-main-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Android project (CI only)
        run: flutter create --no-pub --platforms=android --project-name=waffra --org com.waffra .
      - name: Compile ARM64 release-mode APK (not production certified)
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Attach unapproved-for-production APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: m147-arm64-ci-review-apk-not-production-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
