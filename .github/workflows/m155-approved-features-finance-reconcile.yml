name: M155 Approved Features Finance Reconciliation
on:
  push:
    branches:
      - 'integration/m155-approved-features-finance-authority-20261023'
  workflow_dispatch:
jobs:
  accepted-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze integration
        run: flutter analyze --no-fatal-infos lib/main.dart lib/waffra_secure_backup.dart lib/waffra_backup_files.dart lib/waffra_merchant_rules.dart lib/storage/waffra_m154_transaction_schema_bridge.dart lib/storage/waffra_m155_category_plan.dart test/m153_secure_backup_sms_categories_uat_test.dart test/m155_category_plan_finance_parity_test.dart test/storage/m156_atomic_merchant_category_sms_commit_test.dart
      - name: Test source compatibility
        run: flutter test test/waffra_secure_backup_test.dart test/m153_secure_backup_sms_categories_uat_test.dart test/m154_sqlcipher_m153_transaction_shape_test.dart test/m155_category_plan_finance_parity_test.dart test/storage/m156_atomic_merchant_category_sms_commit_test.dart
      - name: Fail closed on source authority or privacy regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('lib/main.dart').read_text()
          native=Path('native/WaffraMainActivity.kt').read_text()
          backup=Path('lib/waffra_secure_backup.dart').read_text()
          assert '_financeAuthority.commitConfirmedSms' in app
          assert '_financeAuthority.saveCaptured' in app
          assert 'WaffraBackupFiles.saveEncryptedArchive' in app
          assert 'WaffraBackupFiles.openArchive' in app
          assert 'Clipboard.setData(ClipboardData(text:encrypted))' not in app
          assert 'Intent.ACTION_CREATE_DOCUMENT' in native
          assert 'Intent.ACTION_OPEN_DOCUMENT' in native
          assert 'argon2id' in backup and 'pbkdf2-sha256' in backup
          print('No live SQLCipher activation or unsafe archive clipboard export.')
          PY
