name: Waffra M113 Recovery Rollback Regression
on:
  pull_request:
    paths:
      - '.github/workflows/m113-recovery-rollback-regression.yml'
      - 'test/storage/**'
      - 'lib/storage/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: waffra-pr-m113-recovery-rollback-regression-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m412-impact:
    name: M412 Only Run Tests Impacted By Latest PR Update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Compare exact before/after change set (missing evidence means RUN)
        id: impact
        run: python3 scripts/qa/m412_pr_changed_impact.py --workflow .github/workflows/m113-recovery-rollback-regression.yml

  disposable-recovery:
    needs: m412-impact
    if: ${{ needs.m412-impact.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Disposable rollback, tamper and recovery regression
        run: >-
          flutter test
          test/storage/m88_key_recovery_rollback_acceptance_test.dart
          test/storage/m81_parallel_recovery_tamper_acceptance_test.dart
          test/storage/offline_restore_dry_run_test.dart
          test/storage/disposable_recovery_journal_test.dart
          test/storage/m101_cloud_recovery_revision_gate_test.dart
          test/storage/m102_restored_finance_receipt_attestor_test.dart
          test/storage/finance_source_cutover_policy_test.dart
          --reporter expanded
